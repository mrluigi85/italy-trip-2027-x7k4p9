<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Companion — Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F7F7F8;
    --surface-2:#F0F0F2;
    --border:#E7E7EA;
    --ink:#16161A;
    --ink-soft:#71717A;
    --ink-faint:#A8A8AF;
    --accent:#2F6FED;
    --accent-soft:#EAF1FE;
    --florence:#E8863B;
    --cruise:#1C8C8C;
    --rome:#9B6FD1;
    --cantmiss:#E5484D;
    --cantmiss-soft:#FDEBEC;
    --green:#2F9E44;
    --green-soft:#EAF7EC;
    --gold:#C9861A;
    --gold-soft:#FBF1DF;
    --meal-bg:#FDEEE6;
    --meal-accent:#D97757;
    --transport-bg:#E0F2FE;
    --transport-accent:#0EA5E9;
    --hotelcard-bg:#ECFDF5;
    --hotelcard-accent:#10B981;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ background:var(--surface-2); }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
    max-width:480px;
    margin:0 auto;
    position:relative;
    min-height:100vh;
    box-shadow:0 0 30px rgba(0,0,0,0.06);
  }

  /* ---------- Top bar (compact) ---------- */
  header.topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px 8px;
  }
  .menu-btn{
    flex:0 0 auto;
    width:46px; height:46px;
    background:none; border:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    cursor:pointer; padding:0;
  }
  .hbar{
    display:block; width:24px; height:2px; border-radius:1px;
    background:var(--ink);
  }
  .trip-title-compact{ flex:1; min-width:0; }
  .trip-name{ font-size:14.5px; font-weight:800; line-height:1.2; }
  .trip-dates{ font-size:11px; color:var(--ink-soft); font-weight:600; margin-top:1px; }

  /* ---------- Date strip: block-grouped ---------- */
  .date-strip-wrap{ padding:0 0 9px; }
  .date-strip{
    display:flex; align-items:flex-end; gap:5px;
    overflow-x:auto;
    padding:2px 14px 3px;
    scroll-padding-left:7px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .date-strip::-webkit-scrollbar{display:none;}
  .block-sep{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom:9px; margin:0 2px;
  }
  .block-sep .sep-label{
    writing-mode:vertical-rl; text-orientation:mixed;
    font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    color:#fff; padding:5px 2px; border-radius:5px;
  }
  .block-sep.block-florence .sep-label{background:var(--florence);}
  .block-sep.block-cruise .sep-label{background:var(--cruise);}
  .block-sep.block-rome .sep-label{background:var(--rome);}

  .chip{
    flex:0 0 auto;
    scroll-snap-align:start;
    width:42px;
    border-radius:9px 9px 4px 4px;
    background:var(--surface);
    padding:6px 0 0;
    text-align:center;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .chip.block-florence{border-bottom-color:var(--florence);}
  .chip.block-cruise{border-bottom-color:var(--cruise);}
  .chip.block-rome{border-bottom-color:var(--rome);}
  .chip .dow{
    font-size:8.5px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-faint); font-weight:700;
  }
  .chip .dom{
    font-size:14.5px; font-weight:700; line-height:1.5; color:var(--ink);
  }
  .chip.active{ background:var(--ink); }
  .chip.active .dow{ color:rgba(255,255,255,0.6); }
  .chip.active .dom{ color:#fff; }

  /* ---------- Today banner ---------- */
  .today-banner{
    margin:0 18px 4px;
    padding:10px 14px;
    background:var(--accent-soft);
    border-radius:10px;
    font-size:12.5px;
    color:var(--ink);
    font-weight:500;
  }
  .today-banner strong{font-weight:800;}

  /* ---------- Day section ---------- */
  main{padding:20px 18px 0;}
  .lbl-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .block-florence .lbl-dot{background:var(--florence);} .block-florence{color:var(--florence);}
  .block-cruise .lbl-dot{background:var(--cruise);} .block-cruise{color:var(--cruise);}
  .block-rome .lbl-dot{background:var(--rome);} .block-rome{color:var(--rome);}

  .day-header h2{
    margin:0 0 5px; font-size:23px; font-weight:800; letter-spacing:-0.01em; line-height:1.2;
  }
  .day-header h2.block-florence{color:var(--florence);}
  .day-header h2.block-cruise{color:var(--cruise);}
  .day-header h2.block-rome{color:var(--rome);}
  .day-sub{
    display:flex; align-items:flex-start; gap:9px;
    font-size:16.5px; color:var(--ink); margin-bottom:16px; font-weight:700; line-height:1.4;
  }
  .day-sub .accent-bar{
    flex:0 0 3px; width:3px; border-radius:2px; align-self:stretch; margin-top:2px;
  }
  .day-sub.block-florence .accent-bar{background:var(--florence);}
  .day-sub.block-cruise .accent-bar{background:var(--cruise);}
  .day-sub.block-rome .accent-bar{background:var(--rome);}

  .day-toolbar{
    display:flex; justify-content:flex-end; margin-bottom:14px;
  }
  .expand-toggle{
    font-family:'Manrope',sans-serif; font-size:12px; font-weight:700;
    background:var(--surface); border:none; border-radius:20px;
    padding:7px 13px; color:var(--ink-soft); cursor:pointer;
  }
  .expand-toggle:active{background:var(--surface-2);}

  .route-link{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--ink); color:#fff;
    border-radius:20px; padding:8px 14px; margin:12px 0 8px;
    text-decoration:none; font-size:12.5px; font-weight:700;
  }
  .route-link:last-of-type{ margin-bottom:4px; }
  .route-link.secondary{
    background:var(--accent-soft); color:var(--accent); font-size:11.5px; padding:6.5px 13px;
    margin-top:0; margin-right:6px;
    border:1.5px solid var(--accent);
  }

  .driver-box{
    background:var(--gold-soft); border-radius:10px; padding:11px 14px; margin-bottom:14px;
  }
  .driver-title{ font-size:13px; font-weight:800; color:var(--gold); margin-bottom:3px; }
  .driver-line{ font-size:12.5px; font-weight:600; color:#8A5D0F; }

  .getting-here{
    margin:8px 0 8px 28px;
    font-size:12px; color:var(--ink-faint); font-weight:600;
    display:flex; align-items:flex-start; gap:5px;
  }
  .gh-icon{ color:var(--ink-faint); flex:0 0 auto; }

  /* ---------- Timeline + stop cards ---------- */
  .timeline-item{
    display:flex; gap:12px; position:relative;
  }
  .rail{
    flex:0 0 16px;
    display:flex; flex-direction:column; align-items:center;
    padding-top:19px;
  }
  .rail-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--ink-faint); flex-shrink:0;
  }
  /* cantMiss rail dot stays default gray — star emoji on the title is the only can't-miss indicator */
  .rail-line{
    width:1.5px; flex:1;
    background:var(--border);
    margin-top:4px;
  }
  .timeline-item:last-child .rail-line{ display:none; }

  .stop{
    flex:1; min-width:0;
    background:var(--surface);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .stop-head{
    display:flex; align-items:flex-start; gap:10px;
    padding:13px 14px;
    cursor:pointer;
  }
  .stop-time{
    font-size:12px; font-weight:700; color:var(--ink-soft);
    white-space:nowrap; padding-top:2px; min-width:50px;
  }
  .stop-main{flex:1; min-width:0;}
  .stop-name{
    font-weight:700; font-size:15.5px; line-height:1.3; color:var(--ink);
  }
  .stop-meta{
    display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;
  }
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .badge.ticketed{background:var(--gold-soft); color:var(--gold);}
  .badge.free{background:var(--green-soft); color:var(--green);}
  .badge.outside{background:var(--surface-2); color:var(--ink-soft);}
  .badge.duration{background:transparent; color:var(--ink-faint); padding:3px 0; font-weight:600;}
  .badge.timesensitive{background:var(--cantmiss-soft); color:var(--cantmiss); border:1px solid var(--cantmiss);}
  .maps-chip{
    font-size:11px; font-weight:700; color:var(--accent);
    display:inline-flex; align-items:center; gap:3px;
    text-decoration:none;
  }
  .chevron{
    color:var(--ink-soft); font-size:20px; font-weight:700; line-height:1;
    padding-top:1px; flex:0 0 auto;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease;
  }
  .stop.open .chevron{transform:rotate(180deg);}

  .stop-body{
    max-height:0; overflow:hidden;
    transition:max-height .28s ease;
  }
  .stop.open .stop-body{max-height:800px;}
  .stop-body-inner{ padding:0 14px 16px; }
  .stop-desc{
    font-size:14px; line-height:1.6; color:var(--ink); font-weight:450;
  }
  .stop-warning{
    margin-top:10px; padding:9px 11px; background:var(--gold-soft);
    border-radius:8px; font-size:12.5px; line-height:1.45; color:#8A5D0F; font-weight:600;
  }
  .stop-ticket{
    margin-top:10px; font-size:12.5px; font-weight:700;
  }
  .stop-ticket a{color:var(--accent);}

  /* ---------- Section divider ---------- */
  .section-divider{
    font-weight:800; font-size:14px;
    text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink);
    margin:24px 0 12px 0;
    padding-bottom:6px;
    border-bottom:2px solid var(--ink);
    display:flex; align-items:center;
  }

  /* ---------- Menu overlay ---------- */
  .menu-overlay{
    position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; z-index:100;
    background:rgba(22,22,26,0.4);
    display:none;
  }
  .menu-overlay.open{ display:block; }
  .menu-panel{
    position:absolute; top:0; left:0; right:0;
    height:92vh;
    background:#fff;
    border-radius:0 0 20px 20px;
    display:flex; flex-direction:column;
    transform:translateY(-100%);
    transition:transform .25s ease;
  }
  .menu-overlay.open .menu-panel{ transform:translateY(0); }
  .menu-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px;
    flex:0 0 auto;
  }
  .menu-header h3{ margin:0; font-size:17px; font-weight:800; }
  .menu-close{
    width:32px; height:32px; border-radius:50%; border:none;
    background:var(--ink); font-size:14px; color:#fff; cursor:pointer;
    font-weight:700;
  }
  .menu-tabs{
    display:flex; gap:6px; padding:2px 14px 12px;
    flex:0 0 auto;
    border-bottom:1px solid var(--border);
  }
  .menu-tab{
    font-family:'Manrope',sans-serif; font-size:12.5px; font-weight:700;
    background:var(--surface); border:none; border-radius:20px;
    padding:8px 14px; color:var(--ink-soft); cursor:pointer;
  }
  .menu-tab.active{ background:var(--ink); color:#fff; }
  .menu-content{
    flex:1; overflow-y:auto;
    padding:16px 18px 40px;
    -webkit-overflow-scrolling:touch;
  }

  /* Itinerary list inside menu */
  .glance-block-header{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    padding:16px 4px 8px; display:flex; align-items:center; gap:6px;
  }
  .glance-block-header:first-child{ padding-top:0; }
  .glance-row{
    display:flex; gap:10px; align-items:center;
    padding:12px 10px; border-radius:10px; cursor:pointer;
    background:var(--surface); margin-bottom:6px;
  }
  .glance-row:active{ background:var(--surface-2); }
  .glance-date{ font-size:12px; font-weight:800; color:var(--ink-soft); width:52px; flex:0 0 auto; line-height:1.3; }
  .glance-desc{ font-size:13.5px; font-weight:600; color:var(--ink); flex:1; line-height:1.35; }
  .glance-chevron{ font-size:16px; color:var(--ink-faint); flex:0 0 auto; }

  /* Sub-tabs (bookings) */
  /* Sub-tabs (bookings, itinerary) now use the shared .seg-toggle style */

  .book-row{
    padding:11px 12px; background:var(--surface); border-radius:10px; margin-bottom:8px;
  }
  .book-row .b-what{ font-size:13.5px; font-weight:700; }
  .book-row .b-meta{ font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:4px; }
  .status-pill{
    display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:10px; margin-right:6px;
  }
  .status-pill.booked{ background:var(--green-soft); color:var(--green); }
  .status-pill.tobook{ background:var(--gold-soft); color:var(--gold); }

  .meals-table{ width:100%; border-collapse:collapse; font-size:10.5px; }
  .meals-table th{
    text-align:left; font-weight:800; color:var(--ink-faint); font-size:10px;
    padding:6px 4px; border-bottom:2px solid var(--border);
  }
  .meals-table td{
    padding:7px 4px; border-bottom:1px solid var(--border); vertical-align:top;
    line-height:1.35; font-weight:500;
  }
  .meals-table td.meal-date{ font-weight:800; white-space:nowrap; color:var(--ink); }
  .meals-table tr:nth-child(even) td{ background:var(--surface); }

  /* ---------- Shared segmented toggle control ---------- */
  .seg-toggle{
    display:inline-flex; background:var(--surface); border-radius:20px;
    padding:3px; gap:2px; margin-bottom:10px; flex-wrap:wrap;
  }
  .seg-toggle button{
    font-family:'Manrope',sans-serif; font-size:11.5px; font-weight:700;
    background:none; border:none; border-radius:16px;
    padding:6px 13px; color:var(--ink-soft); cursor:pointer;
  }
  .seg-toggle button.active{ background:var(--ink); color:#fff; }

  /* ---------- Day map ---------- */
  .day-map-wrap{ margin-bottom:16px; }
  .day-map{
    width:100%; height:220px; border-radius:12px; overflow:hidden;
    background:var(--surface);
    position:relative; isolation:isolate; z-index:0;
  }
  .leaflet-popup-content{ font-family:'Manrope',sans-serif; font-size:12.5px; font-weight:600; }
  .leaflet-popup-content b{ font-weight:800; }
  .map-legend{
    display:flex; flex-wrap:wrap; gap:10px 14px;
    margin-top:10px; margin-bottom:16px; padding:0 2px;
  }
  .legend-item{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:700; color:var(--ink-soft);
  }
  .legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }

  /* ---------- Trip-wide map (Itinerary tab) ---------- */
  /* .itin-subtoggle now uses the shared .seg-toggle style */
  .trip-map{
    width:100%; height:340px; border-radius:12px; overflow:hidden;
    background:var(--surface); margin-bottom:10px;
    position:relative; isolation:isolate; z-index:0;
  }
  .trip-map-legend{
    display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; font-weight:600; color:var(--ink-soft);
    padding:0 2px;
  }
  .trip-map-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .leg-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .info-block{ margin-bottom:20px; }
  .info-block h4{ font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:0 0 8px; font-weight:800; }
  .info-line{ font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--border); }
  .info-line b{ font-weight:700; }
  .contact-card{
    background:var(--surface); border-radius:12px; padding:14px; font-size:13px; line-height:1.7;
  }
  .contact-card .c-name{ font-weight:800; font-size:14px; margin-bottom:2px; }

  /* ---------- Meal cards (distinct from landmarks) ---------- */
  .stop.meal{
    background:var(--meal-bg);
  }
  .timeline-item.meal .rail-dot{
    background:var(--meal-accent);
  }
  .meal-icon{ font-size:14px; margin-right:2px; }

  /* ---------- Transport cards (distinct from landmarks) ---------- */
  .stop.transport{
    background:var(--transport-bg);
  }
  .timeline-item.transport .rail-dot{
    background:var(--transport-accent);
  }
  .transport-icon{ font-size:14px; margin-right:2px; }
  .stop.transport.critical{
    background:var(--cantmiss-soft);
    border:1.5px solid var(--cantmiss);
  }
  .timeline-item.transport.critical .rail-dot{
    background:var(--cantmiss);
  }

  /* ---------- Hotel check-in cards ---------- */
  .stop.hotel{
    background:var(--hotelcard-bg);
  }
  .timeline-item.hotel .rail-dot{
    background:var(--hotelcard-accent);
  }
  .hotel-icon{ font-size:14px; margin-right:2px; }

  .pin-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    color:#fff; font-size:10px; font-weight:800;
    margin-right:6px; flex-shrink:0; position:relative; top:-1px;
  }

  /* ---------- Intro / city context section ---------- */
  .intro-card{
    background:#F4F8FE;
    border:1px solid #D9E6FA;
    border-radius:var(--radius);
    margin-bottom:16px;
    overflow:hidden;
  }
  .intro-head{
    display:flex; align-items:center; gap:10px;
    padding:13px 14px;
    cursor:pointer;
  }
  .intro-head .intro-icon{ font-size:16px; }
  .intro-head .intro-title{ flex:1; font-weight:800; font-size:14.5px; color:var(--ink); }
  .intro-head .chevron{ padding-top:0; }
  .intro-body{ max-height:0; overflow:hidden; transition:max-height .28s ease; }
  .intro-card.open .intro-body{ max-height:1000px; }
  .intro-card.open .chevron{ transform:rotate(180deg); }
  .intro-body-inner{ padding:0 14px 16px; }
  .intro-text{ font-size:14px; line-height:1.65; color:var(--ink); font-weight:450; }
  .city-links-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .city-map-link{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--accent-soft); color:var(--accent);
    border-radius:16px; padding:6.5px 13px;
    text-decoration:none; font-size:12px; font-weight:700;
    border:1.5px solid var(--accent);
  }

  footer{
    text-align:center; font-size:11px; color:var(--ink-faint); padding:30px 18px 10px; font-weight:500;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <button class="menu-btn" onclick="openMenu()"><span class="hbar"></span><span class="hbar"></span><span class="hbar"></span></button>
    <div class="trip-title-compact">
      <div class="trip-name">Italy, Croatia &amp; Montenegro</div>
      <div class="trip-dates">Jun 5–30, 2027 · Draft</div>
    </div>
  </div>
  <div class="date-strip-wrap">
    <div class="date-strip" id="dateStrip"></div>
  </div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="if(event.target===this)closeMenu()">
  <div class="menu-panel">
    <div class="menu-header">
      <h3>Menu</h3>
      <button class="menu-close" onclick="closeMenu()">✕</button>
    </div>
    <div class="menu-tabs">
      <button class="menu-tab active" data-tab="itinerary" onclick="switchMenuTab('itinerary')">Itinerary</button>
      <button class="menu-tab" data-tab="bookings" onclick="switchMenuTab('bookings')">Bookings</button>
      <button class="menu-tab" data-tab="contacts" onclick="switchMenuTab('contacts')">Contacts</button>
      <button class="menu-tab" data-tab="info" onclick="switchMenuTab('info')">Info</button>
    </div>
    <div class="menu-content" id="menuContent"></div>
  </div>
</div>

<main id="dayContainer"></main>

<script>
// ======================= DUMMY DATA (placeholder only) =======================
const TRIP_START = new Date(2027, 5, 5);
const TRIP_END   = new Date(2027, 5, 30);

const days = [
  { date: new Date(2027,5,5), block: "prelude", title: "Depart Miami", sub: "AA52 departs 8:00pm — plan the Uber XXL for ~4:00-4:15pm.",
    cityPins: [],
    context: null,
    routeUrl: null,
    townRoutes: null,

  { date: new Date(2027,5,6), block: "florence", title: "Arrive Florence", sub: "",
    hotelPin: {"lat":43.7699,"lng":11.2536,"name":"Hotel Davanzati"},
    cityPins: [{"lat":43.7696,"lng":11.2558,"name":"Florence"}],
    context: "Florence began as Florentia, a small colony Julius Caesar planted for his army veterans around 59 BC, laid out on the flat land where the Roman road crossed the Arno river. For over a thousand years afterward it stayed a modest provincial town — nothing suggested it would become the place that reshaped Western art and thought. That changed in the late Middle Ages, when Florence built its fortune on wool. Florentine merchants bought raw, undyed cloth from England and Flanders, refined and dyed it using techniques no one else could match, and sold it back across Europe at enormous markup. The guild that ran this trade, the Arte di Calimala, became the wealthiest and most powerful institution in the city. On the back of that wool money came banking: Florentine houses invented double-entry bookkeeping and letters of credit, and minted the florin in 1252 — a gold coin so trusted for its purity that it became the closest thing medieval Europe had to a single currency, accepted from London to Constantinople.\n\nAll of that wealth needed somewhere to go, and in Florence it went into art and architecture, on a scale and with a competitiveness that had no real precedent. Guilds and banking families spent lavishly on churches and public buildings, each trying to outdo the last, and out of that rivalry came an explosion of talent: Brunelleschi solved the seemingly impossible problem of the Duomo's dome using no flying buttresses and no visible scaffolding, a feat engineers still study. Ghiberti spent 27 years on the Baptistery's bronze doors, which Michelangelo later called the Gates of Paradise. Donatello, Botticelli, and the young Leonardo da Vinci all trained and worked here. Dante Alighieri was born here too, though the city exiled him in 1302 over political feuding — he never returned, and wrote most of the Divine Comedy in bitter exile, cursing Florence even as he immortalized it.\n\nBy the 1400s one family had risen above the rest: the Medici, who started as wool merchants and bankers and became the city's unofficial rulers for three centuries, without ever formally abolishing the republic they governed from behind the scenes. Cosimo de\' Medici bankrolled a generation of artists and scholars; his grandson Lorenzo, called \'the Magnificent,\' personally tutored the teenage Michelangelo. The family survived assassination attempts (the Pazzi conspiracy of 1478 killed Lorenzo\'s brother in the Duomo itself, mid-Mass) and a period of exile after the fiery monk Savonarola briefly seized control of the city and burned books, art, and cosmetics in the Bonfire of the Vanities — before being burned at the stake himself in the same piazza less than a year later. The Medici eventually returned, ruled as Grand Dukes of Tuscany, and when the line finally died out in 1737, the last Medici heir willed the family\'s entire art collection to the city of Florence on the condition it could never be removed — which is a large part of why so much of it is still here today. Your hotel sits in the heart of that historic center, a UNESCO World Heritage Site since 1982, small enough that everything you\'ll see this week is within a comfortable walk.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Cattedrale+di+Santa+Maria+del+Fiore+Florence/Ponte+Vecchio+Florence/Piazza+della+Signoria+Florence/",

  { date: new Date(2027,5,7), block: "florence", title: "Florence: Accademia, Santa Maria Novella, Duomo Complex", sub: "",
    hotelPin: {"lat":43.7699,"lng":11.2536,"name":"Hotel Davanzati"},
    cityPins: [{"lat":43.7696,"lng":11.2558,"name":"Florence"}],
    context: "Today's three stops trace a specific arc through Florentine art history, each one a landmark for a different reason. The Accademia exists almost entirely because of one statue: when the city wanted to protect Michelangelo\'s David from weather damage in 1873, it built this gallery specifically to house him, moving him from his original outdoor spot in front of Palazzo Vecchio (a full-size replica stands there today). What\'s easy to miss is that David was carved from a single block of marble that two other sculptors had already attempted and abandoned as ruined — Michelangelo took on what was considered a wrecked, unusable piece of stone and, working essentially in secret behind a fence for two years, turned it into arguably the most famous sculpture in the Western world. He was 26. Look closely at David\'s right hand: Renaissance artists frequently gave it disproportionate size and prominence, a visual echo of the biblical phrase \'the hand of David,\' and a reminder that this is a study of tension and coiled potential energy, not a relaxed pose — he\'s shown in the moment before the fight with Goliath, not after it.\n\nSanta Maria Novella looks Gothic from a distance but tells a more layered story up close: its green-and-white marble facade, added a full century after the church itself, was designed by Leon Battista Alberti in the 1450s using mathematical ratios borrowed directly from classical architecture — one of the first times Renaissance humanist theory was applied to a church exterior. Inside is Masaccio\'s Trinity fresco from 1427, painted a full generation before Alberti\'s facade, and arguably more historically important than anything else you\'ll see today: it\'s the first painting in Western art to use mathematically correct linear perspective, built with such precision that Florentines at the time reportedly believed Masaccio had cut an actual hole through the wall into a receding chapel. It fundamentally changed how European painters understood and depicted space, and every single perspective drawing done in art school since — including centuries later — traces its lineage back to this one wall.\n\nThe Duomo complex closes the day, and today you\'ll see it from two different vantage points: inside the cathedral itself, and up the Campanile, Giotto\'s bell tower, from which you can actually see Brunelleschi\'s dome — something you can\'t do standing on top of the dome itself. Giotto began the tower in 1334 as the city\'s official capomaestro (master builder), though he died just three years in, having completed only the base; two more architects finished it to his general design over the following decades. The tower is faced in the same pink, white, and green marble as the cathedral and Baptistery, a deliberate visual unity across three separate buildings raised over nearly two centuries — a reminder that almost nothing about the Florence skyline happened quickly.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Galleria+dell%27Accademia+Florence/Santa+Maria+Novella+Florence/Cattedrale+di+Santa+Maria+del+Fiore+Florence/",
    townRoutes: null,
    driverToday: false,
    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati","type":"meal","desc":"Included."},{"time":"9:00am","name":"Accademia Gallery — David","timeSensitive":true,"coords":[43.7769,11.2589],"cantMiss":true,"duration":"60-90 min","access":"ticketed","gettingHere":"~12 min walk from the hotel, north through the historic center toward Piazza San Marco","mapLink":"https://www.google.com/maps/search/?api=1&query=Galleria+dell%27Accademia+Florence","desc":"Michelangelo carved David from a single 17-foot block of Carrara marble that two earlier sculptors had already given up on as flawed. He was 26. Finished in 1504, the statue originally stood outside Palazzo Vecchio as a civic symbol — Florence, like David, defiant against more powerful enemies (Rome, Milan). The gallery also holds his four unfinished 'Prisoners,' figures seemingly still trapped inside the stone, and a long corridor of Florentine Gothic and early Renaissance paintings.","ticket":"🎟️ Book 6-8 weeks ahead for June","warning":"Same-day walk-up queues run 2+ hours in peak season"},{"time":"10:50am","name":"Santa Maria Novella","coords":[43.7746,11.2493],"cantMiss":true,"duration":"45 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Santa+Maria+Novella+Florence","desc":"The principal Dominican church in Florence, its striking green-and-white marble facade designed by Leon Battista Alberti in the 1450s. Inside is Masaccio's Trinity (1427), the first painting in Western art to use mathematically correct linear perspective — visitors at the time reportedly thought there was a real hole in the wall. Ghirlandaio's fresco cycle in the main chapel is said to have influenced the young Michelangelo, who trained in his workshop.","ticket":"🎟️ ~€7.50","warning":null,"gettingHere":"~20 min walk southwest from the Accademia"},{"time":"12:15pm","name":"Lunch — near the Duomo","type":"meal","desc":"TBD.","gettingHere":"~5 min walk from Santa Maria Novella"},{"time":"2:00pm","name":"Duomo interior + Baptistery","coords":[43.773251,11.255474],"cantMiss":true,"duration":"60-75 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Cattedrale+di+Santa+Maria+del+Fiore","desc":"The cathedral itself is free to walk into — a vast, deliberately austere Gothic interior, a striking contrast to the ornate marble exterior. Brunelleschi's dome soars overhead, still the largest masonry dome ever built, completed in 1436 without the flying buttresses or visible scaffolding that engineers of the time thought were required. The adjacent Baptistery, older than the cathedral itself, holds Ghiberti's gilded bronze doors, which Michelangelo nicknamed the 'Gates of Paradise.'","ticket":"🚪 Free (Baptistery ticketed separately, small fee)","warning":null,"gettingHere":"No rush after lunch — it is a short ~5 min walk from wherever you eat near the Duomo, so take your time before the 2pm start"},{"time":"3:30pm","name":"Campanile di Giotto — climb","coords":[43.773251,11.255474],"cantMiss":true,"duration":"40-50 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Campanile+di+Giotto+Florence","desc":"Giotto's bell tower, begun in 1334 — 414 steps up a straight tower with landings to rest along the way, notably easier than the dome climb next door. No advance timed-slot required. The real payoff: this is the one spot in the whole complex where you can actually see Brunelleschi's dome itself, up close — the famous silhouette you can't see while standing on top of it.","ticket":"🎟️ Duomo complex pass — no advance booking needed","warning":null,"gettingHere":"~1 min walk, same piazza as the Duomo — with only these two stops this afternoon, there is no need to rush between them"},{"time":"Evening","name":"Dinner — historic center","type":"meal","desc":"TBD.","gettingHere":"Short walk from the Campanile, wherever looks good"}]

  { date: new Date(2027,5,8), block: "florence", title: "Florence: Uffizi, Piazza della Signoria, Santa Croce, Pitti, Boboli, Sunset", sub: "",
    hotelPin: {"lat":43.7699,"lng":11.2536,"name":"Hotel Davanzati"},
    cityPins: [{"lat":43.7696,"lng":11.2558,"name":"Florence"}],
    context: "The Uffizi exists because of an administrative decision that turned into an art museum almost by accident. Cosimo I de\' Medici commissioned the building in 1560 as \'uffizi\' — offices — to consolidate Florence\'s sprawling government bureaucracy into one place, with a private elevated corridor (the Vasari Corridor, nearly a kilometer long) built so the Medici could walk unseen from the Palazzo Vecchio, over the Ponte Vecchio, straight to their residence at Palazzo Pitti without ever setting foot on a public street. Over generations the family filled the upper floor with their private art collection, and when the Medici line finally ended in 1737, the last heir, Anna Maria Luisa, willed the entire collection to the city on one condition: none of it could ever be sold or removed from Florence. That single clause is a large part of why the Uffizi still holds what it holds today — Botticelli\'s Birth of Venus and Primavera, Leonardo\'s early Annunciation, and works spanning the full arc of the Renaissance under one roof.\n\nSanta Croce, by contrast, is less a single artistic statement than a Who\'s Who of Florentine genius, since the Franciscan basilica became the preferred burial site for the city\'s most famous residents: Michelangelo, Galileo, Machiavelli, and the composer Rossini are all interred here, which is why Florentines nicknamed it the Temple of the Italian Glories. Dante has a monument here too, despite never being buried in the city that exiled him — his actual grave is in Ravenna, a rivalry over his remains that technically continues today. Just outside, Piazza Santa Croce has its own violent history: it was the site of calcio storico, a brutal early form of football that mixed wrestling, boxing, and rugby, played by Florentine nobility since the Renaissance and still revived once a year today, mostly for tradition and bragging rights rather than actual injury tolerance.\n\nCrossing the Arno into the Oltrarno neighborhood changes the mood entirely — this was historically the working-class side of the river, home to artisan workshops rather than banking palaces, and it still has a slightly grittier, more residential feel than the tourist-dense streets north of the water. Palazzo Pitti was originally built in the 1450s for a rival Florentine banking family, the Pitti, who apparently wanted a residence more imposing than anything the Medici had — a plan that backfired badly when the Pitti family went bankrupt a century later and had to sell the palace to the Medici themselves, who then expanded it into their primary residence. The Boboli Gardens behind it became the prototype for the formal Italian garden style that later spread across European royal courts, including, eventually, Versailles. The day ends at Piazzale Michelangelo, a 19th-century viewpoint (not a Renaissance one) built in 1869 specifically to showcase the best panorama of the city — home to a bronze replica of David, since apparently one wasn\'t enough, positioned to look back at the skyline it depicts.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Uffizi+Gallery+Florence/Piazza+della+Signoria+Florence/Basilica+di+Santa+Croce+Florence/Palazzo+Pitti+Florence/Boboli+Gardens+Florence/Piazzale+Michelangelo+Florence/",
    townRoutes: null,
    driverToday: false,
    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati","type":"meal","desc":"Included."},{"time":"9:00am","name":"Uffizi Gallery","timeSensitive":true,"coords":[43.7678,11.2553],"cantMiss":true,"duration":"2.5-3 hrs","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Uffizi+Gallery+Florence","desc":"Built in 1560 as the Medici's administrative offices ('uffizi'), converted to a gallery by the family in the 16th century — one of the first museums in the modern sense. Home to Botticelli's Birth of Venus and Primavera, Leonardo's Annunciation, and a collection that traces Italian painting from Giotto through the High Renaissance. The Vasari Corridor above once let the Medici walk unseen from the Palazzo Vecchio, through the Uffizi, across the Ponte Vecchio, to Palazzo Pitti.","ticket":"🎟️ Book 4-6 weeks ahead for June","warning":null,"gettingHere":"~5 min walk from the hotel, toward the river"},{"time":"12:00pm","name":"Piazza della Signoria & Loggia dei Lanzi","coords":[43.76972,11.25556],"cantMiss":true,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+della+Signoria+Florence","desc":"Florence's outdoor sculpture gallery — Cellini's bronze Perseus holding Medusa's severed head, and the Rape of the Sabine Women, stand in the open loggia, free to see anytime.","ticket":null,"warning":null,"gettingHere":"~2 min walk from the Uffizi exit"},{"time":"12:45pm","name":"Santa Croce","coords":[43.768417,11.262722],"cantMiss":true,"duration":"90 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Basilica+di+Santa+Croce+Florence","desc":"Franciscan basilica, and the 'Temple of the Italian Glories' — the tombs of Michelangelo, Galileo (whose remains weren't allowed a religious burial here until 1737, a century after his death, due to his heresy conviction), and Machiavelli, plus a monument to Dante, whose actual tomb is in Ravenna, where he died in exile. Brunelleschi's Pazzi Chapel in the cloister is considered a masterpiece of early Renaissance architecture.","ticket":"🎟️ ~€8","warning":null,"gettingHere":"~10 min walk east"},{"time":"2:15pm","name":"Lunch — Santa Croce/Sant'Ambrogio","type":"meal","desc":"TBD.","gettingHere":"~2 min walk, right outside Santa Croce"},{"time":"3:30pm","name":"Palazzo Pitti — optional","coords":[43.7648,11.2501],"cantMiss":false,"duration":"60-90 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Palazzo+Pitti+Florence","desc":"Optional, pick one or the other with Boboli if the day is running long — you'll have already done Uffizi and Santa Croce by this point. Built for a rival Florentine banking family in 1458, bought by the Medici in 1549 when they outgrew the Palazzo Vecchio. Now houses several museums including the Palatine Gallery's Raphaels and Titians.","ticket":"🎟️","warning":null,"gettingHere":"~8 min walk to Ponte Vecchio, cross into Oltrarno"},{"time":"5:00pm","name":"Boboli Gardens — optional","coords":[43.7625,11.24833],"cantMiss":true,"duration":"60 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Boboli+Gardens+Florence","desc":"Optional, pick one or the other with Pitti if the day is running long. The Medici's grand formal garden behind Palazzo Pitti, laid out from 1550 — one of the earliest and most influential examples of the Italian garden style, later copied across Europe including at Versailles. Room for the kids to run after two museum-heavy stops.","ticket":"🎟️","warning":null,"gettingHere":"~2 min walk behind Palazzo Pitti — the garden entrance is inside the palace courtyard"},{"time":"9:00pm","name":"Piazzale Michelangelo","coords":[43.762778,11.265056],"cantMiss":true,"duration":"60+ min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazzale+Michelangelo+Florence","desc":"Built in 1869, offering the classic panoramic view of Florence — domes, towers, and the Arno laid out below, with a bronze copy of David at its center. Timed for sunset, ~9:00-9:15pm in June.","ticket":null,"warning":null,"gettingHere":"Try walking via Costa San Giorgio and Via del Forte di San Giorgio, past Forte di Belvedere — shorter and more direct than going all the way around. If that route is closed, either walk the long way around (~30-40 min, steep) or take a taxi (~€10-15, ~10 min)."},{"time":"Dinner","name":"Dinner — near Piazzale Michelangelo","type":"meal","desc":"TBD.","gettingHere":"Right there at Piazzale Michelangelo, or a short walk back down"}]

  { date: new Date(2027,5,9), block: "florence", title: "Bologna Day-Trip", sub: "",
    hotelPin: {"lat":43.7699,"lng":11.2536,"name":"Hotel Davanzati"},
    cityPins: [{"lat":43.7696,"lng":11.2558,"name":"Florence"},{"lat":44.4949,"lng":11.3426,"name":"Bologna"}],
    context: "Bologna carries three nicknames, and each one tells part of its story. La Dotta, the learned, comes from the University of Bologna, founded in 1088 and still functioning today as the oldest university in the Western world — Dante, Petrarch, and Copernicus all studied here. The university didn't just teach; it shaped how European higher education works at all, and its emblem, the graduation laurel wreath, is where the word 'laureate' comes from. La Grassa, the fat one, is about food: this is the city that gave the world tortellini (legend says a local innkeeper shaped the pasta after glimpsing Venus's navel through a keyhole), tagliatelle al ragù (the real ancestor of what gets called 'spaghetti bolognese' everywhere else, though actual Bolognese cooks would never put ragù on spaghetti), and mortadella, the original bologna. La Rossa, the red, refers to both the terracotta rooftops that blanket the skyline and the city's long history as a stronghold of the Italian left, going back to strong socialist and later communist movements in the 20th century — a political identity Bologna still wears comfortably, in contrast to Florence's more conservative reputation just up the rail line.\n\nWhat you'll notice walking through it is the porticoes: covered arcaded walkways lining almost every street, over 38 kilometers of them in total, enough to walk the entire historic center without an umbrella. They started appearing in the 1200s as a practical solution — the university was drawing more students than the city had housing for, so homeowners began extending upper floors out over the street on columns, creating extra living space above while leaving a covered walkway below. The city eventually made porticoes mandatory for new construction, and by the 20th century they'd become so central to Bologna's identity that UNESCO inscribed them as a World Heritage Site in 2021. Bologna also once rivaled San Gimignano for skyline drama: medieval noble families built as many as 180 defensive towers across the city as both status symbols and actual fortifications during periods of factional violence. Only a couple dozen survive, and just two — the famous Asinelli and the visibly leaning Garisenda — dominate the skyline today, built around 1109-1119 by rival families with more ambition than engineering caution.",
    routeUrl: "https://www.google.com/maps/dir/Firenze+Santa+Maria+Novella+Station/Via+Piella+Bologna/Piazza+Maggiore+Bologna/Archiginnasio+Bologna/Via+Pescherie+Vecchie+Bologna/Basilica+di+Santa+Maria+della+Vita+Bologna/Due+Torri+Bologna/",
    townRoutes: [{"label":"Bologna only (walking)","url":"https://www.google.com/maps/dir/Via+Piella+Bologna/Piazza+Maggiore+Bologna/Archiginnasio+Bologna/Via+Pescherie+Vecchie+Bologna/Basilica+di+Santa+Maria+della+Vita+Bologna/Due+Torri+Bologna/"}],

    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati","type":"meal","desc":"Included."},{"time":"9:00am","name":"Train to Bologna", "icon": "🚆","type":"transport","coords":[43.7766,11.2478],"gettingHere":"~10 min walk from the hotel to Firenze SMN","desc":"Frecciarossa, Firenze SMN to Bologna Centrale, ~35 min."},{"section":"BOLOGNA"},{"time":"9:55am","name":"Via Piella — the secret window","coords":[44.499128,11.344842],"cantMiss":false,"duration":"5 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+Piella+Bologna","desc":"A small window in an unmarked wall looking down onto one of Bologna's few remaining visible canals — the city once had over 60km of navigable waterways used to transport goods and power silk mills; most were covered over in the 20th century.","ticket":null,"warning":null,"gettingHere":"~20 min walk down Via Indipendenza from Bologna Centrale"},{"time":"10:30am","name":"Piazza Maggiore & San Petronio","coords":[44.4938,11.3428],"cantMiss":true,"duration":"30 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+Maggiore+Bologna","desc":"Bologna's grand main square, dominated by the Basilica of San Petronio — construction began in 1390 with plans to make it larger than St. Peter's in Rome. The Church intervened, funds were redirected to found the university instead, and the facade remains famously unfinished, half-clad in marble, half bare brick. It's free to enter one of the largest church interiors in the world.","ticket":null,"warning":null,"gettingHere":"~20 min walk down Via Indipendenza from the station"},{"time":"11:00am","name":"Archiginnasio","coords":[44.4926,11.3432],"cantMiss":false,"duration":"30 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Archiginnasio+Bologna","desc":"The main building of Europe's oldest university, in use from 1563 until 1803. The walls and ceilings of its corridors are covered in thousands of   { date: new Date(2027,5,10), block: "florence", title: "Venice — Arrival Day", sub: "",

481-1489 by Pietro Lombardo, one of the earliest and most refined examples of early Venetian Renaissance architecture.","ticket":"🎟️ ~€3/adult","warning":null,"gettingHere":"~8 min walk from Rialto"},{"time":"2:30pm","name":"Libreria Acqua Alta","coords":[45.4368,12.3402],"cantMiss":true,"duration":"30 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Libreria+Acqua+Alta+Venice","desc":"The famous bookshop that stores its stock in bathtubs, gondolas, and a full-size boat — a defense against Venice's periodic flooding. A staircase made entirely of old encyclopedias leads to a canal-view terrace out back.","ticket":null,"warning":null,"gettingHere":"~6 min walk toward Santa Maria Formosa"},{"time":"3:15pm","name":"Scala Contarini del Bovolo","coords":[45.4372,12.3346],"cantMiss":true,"duration":"30 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Scala+Contarini+del+Bovolo+Venice","desc":"A 15th-century external spiral staircase, tucked down a hidden calle off Campo Manin — one of Venice's genuine hidden gems, rarely crowded. 'Bovolo' means snail in Venetian dialect.","ticket":null,"warning":null,"gettingHere":"~7 min walk, roughly halfway between Rialto and San Marco"},{"time":"4:00pm","name":"Piazza San Marco","coords":[45.43389,12.33806],"cantMiss":true,"duration":"15 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+San+Marco+Venice","desc":"The political and religious heart of Venice for over a thousand years, Napoleon reportedly called it 'the drawing room of Europe.'","ticket":null,"warning":null,"gettingHere":"~6 min walk, continuing toward the water"},{"time":"4:15pm","name":"St. Mark's Basilica — exterior","coords":[45.4345,12.3397],"cantMiss":true,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=St+Mark%27s+Basilica+Venice","desc":"Byzantine domes and golden mosaics visible from outside; the loot of centuries of Venetian trade and conquest is built into its very walls, including the four bronze horses looted from Constantinople in 1204.","ticket":null,"warning":null,"gettingHere":"~1 min walk, right there on the piazza"},{"time":"4:45pm","name":"Doge's Palace + Bridge of Sighs — exterior","coords":[45.4337,12.3406],"cantMiss":false,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Doge%27s+Palace+Venice","desc":"The Gothic seat of Venetian government for centuries. The Bridge of Sighs, connecting the palace to the old prisons, is viewable from Ponte della Paglia — condemned prisoners supposedly sighed at their last glimpse of the city through its windows.","ticket":null,"warning":null,"gettingHere":"~1 min walk, right next to the Basilica"},{"time":"5:15pm","name":"Gondola ride","coords":[45.4338,12.3369],"cantMiss":true,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Bacino+Orseolo+Venice","desc":"Venice's main gondola basin, tucked just behind Piazza San Marco. Fixed rate, one gondola fits all four of you.","ticket":"~€90 for 30 min","warning":null,"gettingHere":"~4 min walk to Bacino Orseolo"},{"time":"7:30pm","name":"Dinner — Da Mamo","type":"meal","coords":[45.4373,12.3363],"desc":"Between San Marco and Rialto, ~10 min walk from the square.","gettingHere":"~10 min walk from Bacino Orseolo, between San Marco and Rialto"}]

  { date: new Date(2027,5,12), block: "florence", title: "Siena & San Gimignano — Private Driver", sub: "",
    hotelPin: {"lat":43.7699,"lng":11.2536,"name":"Hotel Davanzati"},
    cityPins: [{"lat":43.3183,"lng":11.3311,"name":"Siena"},{"lat":43.4677,"lng":11.0431,"name":"San Gimignano"}],
    context: "For most of the 1200s and early 1300s, Siena wasn't Florence's lesser rival — it was, for stretches, genuinely ahead. The two republics fought constantly over trade routes and territory, and in 1260 Siena inflicted one of medieval Tuscany's most decisive defeats on Florence at the Battle of Montaperti, a victory still commemorated in Sienese pride centuries later (Dante, a Florentine, was still bitter enough about it decades afterward to devote a passage of the Inferno to the battle's bloodshed). Siena's wealth came from banking and the wool and textile trade along the Via Francigena, the great pilgrim road to Rome that ran straight through the city — the Sienese bank Monte dei Paschi di Siena, founded in 1472, is the oldest bank in the world still operating today. All of that money went into an extraordinary building campaign centered on Piazza del Campo, the shell-shaped main square still considered one of the finest public spaces in Europe, and into a cathedral so ambitious that Siena tried to nearly quadruple its size in the 1300s by building an entirely new nave — you can still see the abandoned, unfinished wall of that expansion today, a permanent monument to what happened next.\n\nWhat happened next was the Black Death. It reached Siena in 1348 and killed an estimated two-thirds of the population within months, including most of the skilled workers and architects mid-project — the cathedral expansion simply stopped and was never resumed. Siena never recovered its former momentum; the city that emerges in the historical record afterward is poorer, smaller, and increasingly eclipsed by an ascendant Florence. In a strange way, that arrested development is why Siena looks the way it does now: while Florence kept building and modernizing through the Renaissance and after, Siena stayed largely frozen in its Gothic form, which is exactly why its brick-and-stone streets feel so different from Florence's marble and Renaissance symmetry just 70 kilometers north. The city's fierce local identity survives today in the Palio di Siena, a bareback horse race around the Campo held twice each summer since medieval times, contested by ten of the city's seventeen contrade (historic neighborhoods) in a rivalry residents take with genuine, lifelong seriousness.\n\nSan Gimignano, an hour away, tells a related but distinct story. Its nickname, 'Medieval Manhattan,' comes from the 14 surviving tower-houses — out of an original 72 — that its noble families built between the 1100s and 1300s, partly as status symbols in an ongoing one-upmanship contest, partly as actual defensive strongholds during periods of factional violence between rival clans. San Gimignano's economy also depended on the Via Francigena pilgrim traffic, and it too was hit hard by the Black Death and by a shift in trade routes that bypassed the town afterward — the same economic stagnation that froze Siena in time preserved San Gimignano's skyline almost intact, since no one had the money to tear the towers down and modernize.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Piazza+del+Campo+Siena/Siena+Cathedral+Duomo/Porta+San+Giovanni+San+Gimignano/Piazza+della+Cisterna+San+Gimignano/Porta+San+Matteo+San+Gimignano/",
    townRoutes: [{"label":"Siena only (walking)","url":"https://www.google.com/maps/dir/Piazza+del+Campo+Siena/Palazzo+Pubblico+Siena/Torre+del+Mangia+Siena/Via+di+Citta+Siena/Siena+Cathedral+Duomo/Piazza+San+Giovanni+Siena/Facciatone+Siena/"},{"label":"San Gimignano only (walking)","url":"https://www.google.com/maps/dir/Porta+San+Giovanni+San+Gimignano/Via+San+Giovanni+San+Gimignano/Piazza+della+Cisterna+San+Gimignano/Piazza+del+Duomo+San+Gimignano/Duomo+di+San+Gimignano/Torre+Grossa+San+Gimignano/Via+San+Matteo+San+Gimignano/Church+of+Sant%27Agostino+San+Gimignano/Porta+San+Matteo+San+Gimignano/"}],
    driverToday: true,
    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati (early)","type":"meal","desc":"Included."},{"time":"9:00am","name":"Pickup at Hotel Davanzati","type":"transport","desc":"Truescany driver.","gettingHere":"Right at the hotel, after breakfast"},{"section":"SIENA"},{"time":"~10:15am","name":"Piazza del Campo","coords":[43.318333,11.331389],"cantMiss":true,"duration":"20 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+del+Campo+Siena","desc":"The shell-shaped main square, one of the great medieval piazzas in Europe, sloping down toward the Palazzo Pubblico like an amphitheater. Twice a year (July 2 and August 16) it becomes the track for the Palio, a bareback horse race between Siena's 17 historic contrade (districts) that dates to the Middle Ages.","ticket":null,"warning":null,"gettingHere":"Driver drops you directly here, ~1h15 drive from Florence"},{"time":"10:35am","name":"Palazzo Pubblico","coords":[43.31833,11.33139],"cantMiss":false,"duration":"10 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Palazzo+Pubblico+Siena","desc":"Siena's Gothic town hall, completed in 1310 — courtyard only today, not visiting the Museo Civico interior, which holds Lorenzetti's famous 'Allegory of Good and Bad Government' frescoes.","ticket":null,"warning":null,"gettingHere":"~1 min walk, right on the Campo"},{"time":"10:45am","name":"Torre del Mangia","coords":[43.3182111,11.3322528],"cantMiss":false,"duration":"5 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Torre+del+Mangia+Siena","desc":"Siena's 88-meter bell tower, viewing from the base only — not climbing today.","ticket":null,"warning":null,"gettingHere":"~1 min walk, rises directly from Palazzo Pubblico"},{"time":"10:50am","name":"Via di Città → Via del Capitano","coords":[43.2975,11.33],"cantMiss":false,"duration":"10 min walk","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+di+Citta+Siena","desc":"Lined with medieval palazzi — the connecting walk between the Campo and the Duomo.","ticket":null,"warning":null,"gettingHere":"~5 min walk, the direct route from the Campo up to the Duomo"},{"time":"11:00am","name":"Siena Cathedral (Duomo)","coords":[43.317185,11.328823],"cantMiss":true,"duration":"45 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Siena+Cathedral+Duomo","desc":"Consecrated in 1215, one of the great Gothic cathedrals of Italy — striped black-and-white marble inside and out (the colors of Siena's mythical founders' horse), an extraordinary inlaid marble floor with 56 panels made over two centuries, and the vividly frescoed Piccolomini Library. A planned 14th-century expansion to make it the largest church in the world was abandoned after the Black Death — you can still see the unfinished nave walls today.","ticket":"🎟️ OPA SI Pass","warning":null,"gettingHere":"~1 min walk, at the top of Via del Capitano"},{"time":"11:45am","name":"Battistero di San Giovanni","coords":[43.3028,11.3297],"cantMiss":false,"duration":"15 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+San+Giovanni+Siena","desc":"Tucked beneath the Duomo's apse — because Siena's cathedral sits on a slope, the Baptistery was built as a supporting structure one level down, reached by its own staircase into a small piazza. Jacopo della Quercia's bronze baptismal font inside has panels by Donatello and Ghiberti.","ticket":"🎟️ Same pass","warning":null,"gettingHere":"~2 min walk down the staircase from the Duomo's apse, into Piazza San Giovanni"},{"time":"12:00pm","name":"Facciatone climb","coords":[43.3033,11.3291],"cantMiss":true,"duration":"20 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Facciatone+Siena","desc":"The unfinished wall of that abandoned 'New Cathedral' expansion, now a viewing platform. A gentler climb than Torre del Mangia — two levels, the lower looking over the rooftops toward the Campo, the upper opening to a full panorama of the walled city and countryside.","ticket":"🎟️ Same pass","warning":null,"gettingHere":"~2 min walk back up from the Baptistery, at the Duomo level"},{"section":"SAN GIMIGNANO"},{"time":"~1:30pm","name":"Porta San Giovanni","coords":[43.4672,11.0431],"cantMiss":false,"duration":"—","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Porta+San+Giovanni+San+Gimignano","desc":"The medieval south gate — main entry point into the walled town.","ticket":null,"warning":null,"gettingHere":"Driver drop-off here, ~40 min from Siena"},{"time":"1:35pm","name":"Via San Giovanni","coords":[43.4678,11.0432],"cantMiss":false,"duration":"10 min walk","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+San+Giovanni+San+Gimignano","desc":"The main street climbing from the gate toward the town center.","ticket":null,"warning":null,"gettingHere":"~1 min walk, begins right at Porta San Giovanni"},{"time":"1:45pm","name":"Lunch — San Gimignano","type":"meal","coords":[43.468,11.0433],"cantMiss":false,"duration":"45 min","access":"outside","mapLink":null,"desc":"TBD — plenty of options along Via San Giovanni and around Piazza della Cisterna.","ticket":"TBD","warning":null,"gettingHere":"~3 min walk further up Via San Giovanni"},{"time":"2:30pm","name":"Piazza della Cisterna","coords":[43.4674,11.0428],"cantMiss":true,"duration":"20 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+della+Cisterna+San+Gimignano","desc":"The triangular heart of town, named for its 13th-century well, ringed by medieval tower-houses. Home to Gelateria Dondoli, twice crowned world gelato champion — officially recognized as among the best in Italy.","ticket":null,"warning":null,"gettingHere":"~3 min walk further up Via San Giovanni"},{"time":"2:50pm","name":"Piazza del Duomo","coords":[43.4677861,11.0431444],"cantMiss":false,"duration":"5 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+del+Duomo+San+Gimignano","desc":"The civic and religious center of town — Duomo, Palazzo Comunale, and the twin Salvucci towers all face this square.","ticket":null,"warning":null,"gettingHere":"~1 min walk, a few steps north"},{"time":"2:55pm","name":"Duomo di San Gimignano (Collegiata)","coords":[43.4677861,11.0431444],"cantMiss":true,"duration":"30 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Duomo+di+San+Gimignano","desc":"Formally a collegiate church, not a true cathedral, since San Gimignano never had its own bishop — but colloquially always called 'the Duomo.' The walls are entirely covered in fresco cycles, including a dramatic Last Judgment. Modest dress required.","ticket":"🎟️ ~€5","warning":null,"gettingHere":"~1 min walk, right on Piazza del Duomo"},{"time":"3:25pm","name":"Torre Grossa","coords":[43.4676278,11.0429028],"cantMiss":false,"duration":"5 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Torre+Grossa+San+Gimignano","desc":"The tallest tower in town at 54m, 218 steps — viewing from the base only, not climbing today.","ticket":null,"warning":null,"gettingHere":"~1 min walk, same piazza, part of the Palazzo Comunale"},{"time":"3:30pm","name":"Via San Matteo","coords":[43.4691,11.0428],"cantMiss":false,"duration":"15 min walk","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+San+Matteo+San+Gimignano","desc":"Continuing north — quieter than Via San Giovanni, lined with old workshops and tower bases.","ticket":null,"warning":null,"gettingHere":"~3 min walk from Torre Grossa"},{"time":"3:45pm","name":"Church of Sant'Agostino","coords":[43.4699,11.0429],"cantMiss":false,"duration":"20 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Church+of+Sant%27Agostino+San+Gimignano","desc":"Optional, only if e   { date: new Date(2027,5,13), block: "florence", title: "Val d'Orcia: Pienza & Montepulciano — Private Driver", sub: "",

    context: "The Val d'Orcia is a UNESCO World Heritage cultural landscape — rolling golden hills, cypress-lined roads, and hilltop towns that came to embody the Renaissance ideal of a harmonious, humanized countryside. Pienza was rebuilt almost overnight in the 1450s as Pope Pius II's 'ideal city,' the first planned Renaissance town in Italy. Montepulciano, perched on a limestone ridge, is the source of Vino Nobile, one of Italy's oldest and most prestigious wines.",

he old walls looking south over the Val d'Orcia toward Monte Amiata. Walk back through Via dell'Amore, a short connecting alley, not a destination in itself.","ticket":null,"warning":null,"gettingHere":"~4 min walk down Corso Il Rossellino, near Porta al Ciglio"},{"section":"MONTEPULCIANO"},{"time":"~3:30pm","name":"Porta al Prato","coords":[43.0925,11.7844],"cantMiss":false,"duration":"—","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Porta+al+Prato+Montepulciano","desc":"The town's main gate, at the base of a roughly 1km climb to the top.","ticket":null,"warning":null,"gettingHere":"Driver drop-off and pickup, same gate, ~30 min from Pienza"},{"time":"3:35pm","name":"Via di Gracciano nel Corso","coords":[43.094,11.7855],"cantMiss":false,"duration":"20 min walk","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+di+Gracciano+nel+Corso+Montepulciano","desc":"The main corso climbing uphill, changing names several times along the way. Look for the Marzocco Column (Florence's heraldic lion, marking 16th-century Medici rule over the town), Palazzo Bucelli with ancient Etruscan and Roman inscriptions embedded in its base, and the Torre di Pulcinella, a clock tower with a jester figure that strikes the hours.","ticket":null,"warning":null,"gettingHere":"~1 min walk, begins right at Porta al Prato"},{"time":"3:55pm","name":"Chiesa di Sant'Agostino","coords":[43.095,11.7867],"cantMiss":false,"duration":"10 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Chiesa+di+Sant%27Agostino+Montepulciano","desc":"A small church along the climb, facade attributed to Michelozzo.","ticket":null,"warning":null,"gettingHere":"~4 min walk up the corso"},{"time":"4:10pm","name":"Piazza San Francesco","coords":[43.0958,11.787],"cantMiss":false,"duration":"10 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+San+Francesco+Montepulciano","desc":"A rest stop partway up the climb — genuinely panoramic views over the countryside.","ticket":null,"warning":null,"gettingHere":"~4 min walk further up the climb"},{"time":"4:25pm","name":"Piazza Grande","coords":[43.0967,11.7876],"cantMiss":true,"duration":"15 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+Grande+Montepulciano","desc":"The top of the town, 605m above sea level — the Duomo and the crenellated Palazzo Comunale, deliberately modeled on Florence's Palazzo Vecchio to assert Florentine-aligned civic identity after Montepulciano's long struggle between Florence and Siena for control of the town.","ticket":null,"warning":null,"gettingHere":"~4 min walk further up, at the top of the town"},{"time":"4:40pm","name":"Duomo di Montepulciano & Pozzo dei Grifi e dei Leoni","coords":[43.0966,11.7877],"cantMiss":false,"duration":"20 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Duomo+di+Montepulciano","desc":"An intentionally unfinished, raw stone facade conceals a polished Renaissance interior with Taddeo di Bartolo's altarpiece. The old wishing well opposite, topped with griffins and lions, gives the piazza its full name.","ticket":null,"warning":null,"gettingHere":"~1 min walk, right on Piazza Grande"},{"time":"5:00pm","name":"Return directly to Porta al Prato","coords":[43.0925,11.7844],"cantMiss":false,"duration":"15 min walk","access":"outside","mapLink":null,"desc":"No further stops on the way down — straight back to the gate.","ticket":null,"warning":null,"gettingHere":"~15 min walk straight back down from Piazza Grande — no further stops"},{"time":"~6:00pm","name":"Dinner — near the hotel","type":"meal","desc":"TBD, near the hotel.","gettingHere":"~1h45 drive back to Florence from Montepulciano with your driver"}]

  { date: new Date(2027,5,14), block: "florence", title: "Ravenna & Porto Corsini — Embarkation Day", sub: "",
    hotelPin: {"lat":43.7699,"lng":11.2536,"name":"Hotel Davanzati"},
    cityPins: [{"lat":44.4177,"lng":12.1997,"name":"Ravenna"}],
    context: "By the early 400s AD, Rome itself had become too vulnerable to serve as the capital of its own empire — under repeated threat from Visigothic invasions, poorly defended, and increasingly irrelevant to where real power actually sat. In 402 AD, Emperor Honorius moved the capital of the Western Roman Empire to Ravenna instead: a small city ringed by marshes and lagoons that made it far easier to defend, with direct sea access via a nearby port for supply and escape if needed. Ravenna held that role until the Western Empire formally collapsed in 476 AD — meaning the last Western Roman emperor, Romulus Augustulus, was deposed here, not in Rome. What followed was, if anything, an even more improbable run: Ravenna became capital of the Ostrogothic Kingdom under Theodoric the Great, who ruled a huge swath of former Roman territory from here, and then, after the Byzantine general Belisarius reconquered Italy, capital of the Byzantine Exarchate of Ravenna — an outpost of the Eastern Roman Empire governing Byzantine Italy from a city physically closer to Venice than to Constantinople.\n\nEach of those regimes needed to project legitimacy and power, and each did it the same way: through mosaics, built on a scale and with a technical sophistication that few other places in the former empire could match. The Byzantine style in particular used small glass tesserae set at deliberately uneven angles, so the mosaics catch and scatter candlelight rather than absorbing it — an effect that still works today under modern lighting. The most famous panels, inside the Basilica of San Vitale, depict the Byzantine emperor Justinian and empress Theodora in full ceremonial dress, flanking the altar — political propaganda in glass, since neither of them ever actually set foot in Ravenna. What makes all of this survive so completely is, oddly, Ravenna's later irrelevance: the harbor silted up, the city's strategic and economic importance collapsed, and for the next thousand-plus years Ravenna was a backwater with neither the money nor the motivation to renovate or replace what earlier centuries had built. The mosaics simply sat there, undisturbed, while cities like Florence and Venice tore down and rebuilt their own medieval treasures in newer styles. UNESCO now lists eight of Ravenna's Early Christian monuments together as a single World Heritage Site, describing them as achieving 'a very high artistic expression' that bridges the classical Roman, early Christian, and Byzantine worlds in a way found almost nowhere else outside Istanbul itself.\n\nRavenna has one more claim worth knowing before you go: it's where Dante Alighieri died in 1321 and is buried, having spent his final years here in exile from his native Florence. Florence has spent centuries — including formal requests as recently as the 20th century — trying to get his remains back. Ravenna has always refused.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Basilica+di+San+Vitale+Ravenna/Dante%27s+Tomb+Ravenna/Basilica+di+Sant%27Apollinare+Nuovo+Ravenna/Porto+Corsini+Cruise+Terminal/",
    townRoutes: [{"label":"Ravenna only (walking)","url":"https://www.google.com/maps/dir/Basilica+di+San+Vitale+Ravenna/Mausoleum+of+Galla+Placidia+Ravenna/Via+Cavour+Ravenna/Piazza+del+Popolo+Ravenna/Dante%27s+Tomb+Ravenna/Basilica+di+Sant%27Apollinare+Nuovo+Ravenna/"}],
    driverToday: true,
    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati (early)","type":"meal","desc":"Included."},{"time":"7:00am","name":"Pickup at Hotel Davanzati, with luggage","type":"transport","desc":"Truescany driver.","gettingHere":"Right at the hotel, after breakfast, bags packed"},{"section":"RAVENNA"},{"time":"9:15am","name":"Basilica di San Vitale","coords":[44.4177,12.1997],"cantMiss":true,"duration":"30 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Basilica+di+San+Vitale+Ravenna","desc":"Consecrated in 547 AD under Byzantine emperor Justinian I, an octagonal church whose apse holds the most celebrated Byzantine mosaics outside Istanbul — golden panels of Justinian and Empress Theodora, each with their full court, facing each other across the altar. Dante is thought to have seen these mosaics himself while living in Ravenna, and some scholars believe they influenced his descriptions of paradise in the Divine Comedy.","ticket":"🎟️ Combined Ravenna pass","warning":null,"gettingHere":"Driver drop-off, ~2h drive from Florence"},{"time":"9:45am","name":"Mausoleum of Galla Placidia","timeSensitive":true,"coords":[44.4176,12.1998],"cantMiss":true,"duration":"15 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Mausoleum+of+Galla+Placidia+Ravenna","desc":"A small, unassuming brick exterior hides one of the most atmospheric interiors in Italy — a dark chamber under a deep blue ceiling scattered with gold stars, built around 430 AD as a chapel, though Galla Placidia (daughter, sister, wife, and mother of four different Roman emperors) is not actually buried here.","ticket":"🎟️ Timed-entry — mandatory, sells out weeks ahead in peak season","warning":null,"gettingHere":"~1 min walk, right next to San Vitale"},{"time":"10:00am","name":"Via Cavour","coords":[44.4172,12.2013],"cantMiss":false,"duration":"15 min walk","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+Cavour+Ravenna","desc":"An elegant central street leading toward Piazza del Popolo.","ticket":null,"warning":null,"gettingHere":"~4 min walk, the main route out of the San Vitale complex"},{"time":"10:15am","name":"Piazza del Popolo","coords":[44.4161,12.2025],"cantMiss":false,"duration":"10 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+del+Popolo+Ravenna","desc":"Ravenna's main square, roughly midway on the walk to Sant'Apollinare Nuovo.","ticket":null,"warning":null,"gettingHere":"~4 min walk further along Via Cavour"},{"time":"10:30am","name":"Dante's Tomb","coords":[44.4156,12.2013],"cantMiss":true,"duration":"15 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Dante%27s+Tomb+Ravenna","desc":"Dante Alighieri, exiled from his native Florence for political reasons, died in Ravenna in 1321 and is buried here. Florence has spent centuries trying to get his remains back — a neoclassical tomb was even built for him in Santa Croce in 1829, and it remains empty to this day. Ravenna has consistently refused to return him.","ticket":"🚪 Free","warning":null,"gettingHere":"~3 min walk from Piazza del Popolo"},{"time":"10:55am","name":"Basilica di Sant'Apollinare Nuovo","coords":[44.4133,12.2036],"cantMiss":true,"duration":"30 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Basilica+di+Sant%27Apollinare+Nuovo+Ravenna","desc":"Built by the Ostrogothic King Theodoric around 500 AD, originally for Arian Christian worship before being reconsecrated to Catholic use. Two long mosaic processions line the nave — 22 female saints and 26 male saints and martyrs — marching from the old port city of Classe and from Theodoric's palace toward Christ and the Madonna.","ticket":"🎟️ Combined Ravenna pass","warning":null,"gettingHere":"~4 min walk from Dante's Tomb — driver meets you here"},{"time":"1:30pm","name":"Porto Corsini Cruise Terminal","critical":true,"timeSensitive":true,"type":"transport","coords":[44.4914,12.2789],"cantMiss":false,"duration":"—","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Porto+Corsini+Cruise+Terminal","desc":"","ticket":null,"warning":"Must be on board by 2:00pm — ship departs 5:00pm","gettingHere":"Driver picks you up here for the ~15 min transfer to the port"},{"time":"~2:30pm","name":"Lunch — onboard","type":"meal","desc":"Once aboard, lunch service is available.","gettingHere": "You're on the ship"},{"time":"Evening","name":"Dinner — onboard","type":"meal","desc":"First night of the cruise, main dining room.","gettingHere": "You're back on the ship for the evening"}]
