<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Companion — Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F7F7F8;
    --surface-2:#F0F0F2;
    --border:#E7E7EA;
    --ink:#16161A;
    --ink-soft:#71717A;
    --ink-faint:#A8A8AF;
    --accent:#2F6FED;
    --accent-soft:#EAF1FE;
    --florence:#E8863B;
    --cruise:#1C8C8C;
    --rome:#9B6FD1;
    --cantmiss:#E5484D;
    --cantmiss-soft:#FDEBEC;
    --green:#2F9E44;
    --green-soft:#EAF7EC;
    --gold:#C9861A;
    --gold-soft:#FBF1DF;
    --meal-bg:#FDEEE6;
    --meal-accent:#D97757;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }

  /* ---------- Top bar (compact) ---------- */
  header.topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px 8px;
  }
  .menu-btn{
    flex:0 0 auto;
    width:34px; height:34px; border-radius:9px;
    background:var(--surface); border:none;
    font-size:15px; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .trip-title-compact{ flex:1; min-width:0; }
  .trip-name{ font-size:14.5px; font-weight:800; line-height:1.2; }
  .trip-dates{ font-size:11px; color:var(--ink-soft); font-weight:600; margin-top:1px; }

  /* ---------- Date strip: block-grouped ---------- */
  .date-strip-wrap{ padding:0 0 9px; }
  .date-strip{
    display:flex; align-items:flex-end; gap:5px;
    overflow-x:auto;
    padding:2px 14px 3px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .date-strip::-webkit-scrollbar{display:none;}
  .block-sep{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom:9px; margin:0 2px;
  }
  .block-sep .sep-label{
    writing-mode:vertical-rl; text-orientation:mixed;
    font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    color:#fff; padding:5px 2px; border-radius:5px;
  }
  .block-sep.block-florence .sep-label{background:var(--florence);}
  .block-sep.block-cruise .sep-label{background:var(--cruise);}
  .block-sep.block-rome .sep-label{background:var(--rome);}

  .chip{
    flex:0 0 auto;
    scroll-snap-align:start;
    width:42px;
    border-radius:9px 9px 4px 4px;
    background:var(--surface);
    padding:6px 0 0;
    text-align:center;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .chip.block-florence{border-bottom-color:var(--florence);}
  .chip.block-cruise{border-bottom-color:var(--cruise);}
  .chip.block-rome{border-bottom-color:var(--rome);}
  .chip .dow{
    font-size:8.5px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-faint); font-weight:700;
  }
  .chip .dom{
    font-size:14.5px; font-weight:700; line-height:1.5; color:var(--ink);
  }
  .chip.active{ background:var(--ink); }
  .chip.active .dow{ color:rgba(255,255,255,0.6); }
  .chip.active .dom{ color:#fff; }

  /* ---------- Today banner ---------- */
  .today-banner{
    margin:0 18px 4px;
    padding:10px 14px;
    background:var(--accent-soft);
    border-radius:10px;
    font-size:12.5px;
    color:var(--ink);
    font-weight:500;
  }
  .today-banner strong{font-weight:800;}

  /* ---------- Day section ---------- */
  main{padding:20px 18px 0;}
  .lbl-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .block-florence .lbl-dot{background:var(--florence);} .block-florence{color:var(--florence);}
  .block-cruise .lbl-dot{background:var(--cruise);} .block-cruise{color:var(--cruise);}
  .block-rome .lbl-dot{background:var(--rome);} .block-rome{color:var(--rome);}

  .day-header h2{
    margin:0 0 5px; font-size:23px; font-weight:800; letter-spacing:-0.01em; line-height:1.2;
  }
  .day-header h2.block-florence{color:var(--florence);}
  .day-header h2.block-cruise{color:var(--cruise);}
  .day-header h2.block-rome{color:var(--rome);}
  .day-sub{
    display:flex; align-items:flex-start; gap:9px;
    font-size:16.5px; color:var(--ink); margin-bottom:16px; font-weight:700; line-height:1.4;
  }
  .day-sub .accent-bar{
    flex:0 0 3px; width:3px; border-radius:2px; align-self:stretch; margin-top:2px;
  }
  .day-sub.block-florence .accent-bar{background:var(--florence);}
  .day-sub.block-cruise .accent-bar{background:var(--cruise);}
  .day-sub.block-rome .accent-bar{background:var(--rome);}

  .day-toolbar{
    display:flex; justify-content:flex-end; margin-bottom:14px;
  }
  .expand-toggle{
    font-family:'Manrope',sans-serif; font-size:12px; font-weight:700;
    background:var(--surface); border:none; border-radius:20px;
    padding:7px 13px; color:var(--ink-soft); cursor:pointer;
  }
  .expand-toggle:active{background:var(--surface-2);}

  .route-link{
    display:flex; align-items:center; gap:8px;
    background:var(--ink); color:#fff;
    border-radius:10px; padding:12px 14px; margin-bottom:10px;
    text-decoration:none; font-size:13.5px; font-weight:700;
  }
  .route-link:last-of-type{ margin-bottom:18px; }
  .route-link.secondary{
    background:var(--surface-2); color:var(--ink); font-size:12.5px; padding:10px 14px;
  }

  .driver-box{
    background:var(--gold-soft); border-radius:10px; padding:11px 14px; margin-bottom:14px;
  }
  .driver-title{ font-size:13px; font-weight:800; color:var(--gold); margin-bottom:3px; }
  .driver-line{ font-size:12.5px; font-weight:600; color:#8A5D0F; }

  .getting-here{
    margin:8px 0 8px 28px;
    font-size:12px; color:var(--ink-faint); font-weight:600;
    display:flex; align-items:flex-start; gap:5px;
  }
  .gh-icon{ color:var(--ink-faint); flex:0 0 auto; }

  /* ---------- Timeline + stop cards ---------- */
  .timeline-item{
    display:flex; gap:12px; position:relative;
  }
  .rail{
    flex:0 0 16px;
    display:flex; flex-direction:column; align-items:center;
    padding-top:19px;
  }
  .rail-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--ink-faint); flex-shrink:0;
  }
  .timeline-item.cantmiss .rail-dot{ background:var(--cantmiss); }
  .rail-line{
    width:1.5px; flex:1;
    background:var(--border);
    margin-top:4px;
  }
  .timeline-item:last-child .rail-line{ display:none; }

  .stop{
    flex:1; min-width:0;
    background:var(--surface);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .stop-head{
    display:flex; align-items:flex-start; gap:10px;
    padding:13px 14px;
    cursor:pointer;
  }
  .stop-time{
    font-size:12px; font-weight:700; color:var(--ink-soft);
    white-space:nowrap; padding-top:2px; min-width:50px;
  }
  .stop-main{flex:1; min-width:0;}
  .stop-name{
    font-weight:700; font-size:15.5px; line-height:1.3; color:var(--ink);
  }
  .stop-meta{
    display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;
  }
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .badge.ticketed{background:var(--gold-soft); color:var(--gold);}
  .badge.free{background:var(--green-soft); color:var(--green);}
  .badge.outside{background:var(--surface-2); color:var(--ink-soft);}
  .badge.duration{background:transparent; color:var(--ink-faint); padding:3px 0; font-weight:600;}
  .maps-chip{
    font-size:11px; font-weight:700; color:var(--accent);
    display:inline-flex; align-items:center; gap:3px;
    text-decoration:none;
  }
  .chevron{
    color:var(--ink-soft); font-size:20px; font-weight:700; line-height:1;
    padding-top:1px; flex:0 0 auto;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease;
  }
  .stop.open .chevron{transform:rotate(180deg);}

  .stop-body{
    max-height:0; overflow:hidden;
    transition:max-height .28s ease;
  }
  .stop.open .stop-body{max-height:800px;}
  .stop-body-inner{ padding:0 14px 16px; }
  .stop-photo{
    width:100%; aspect-ratio:16/9; border-radius:10px; margin-bottom:12px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); font-size:12px; font-weight:600;
  }
  .stop-desc{
    font-size:14px; line-height:1.6; color:var(--ink); font-weight:450;
  }
  .stop-warning{
    margin-top:10px; padding:9px 11px; background:var(--gold-soft);
    border-radius:8px; font-size:12.5px; line-height:1.45; color:#8A5D0F; font-weight:600;
  }
  .stop-ticket{
    margin-top:10px; font-size:12.5px; font-weight:700;
  }
  .stop-ticket a{color:var(--accent);}

  /* ---------- Section divider ---------- */
  .section-divider{
    font-weight:800; font-size:12.5px;
    text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint);
    margin:20px 0 10px 28px;
  }

  /* ---------- Menu overlay ---------- */
  .menu-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(22,22,26,0.4);
    display:none;
  }
  .menu-overlay.open{ display:block; }
  .menu-panel{
    position:absolute; top:0; left:0; right:0;
    height:92vh;
    background:#fff;
    border-radius:0 0 20px 20px;
    display:flex; flex-direction:column;
    transform:translateY(-100%);
    transition:transform .25s ease;
  }
  .menu-overlay.open .menu-panel{ transform:translateY(0); }
  .menu-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px;
    flex:0 0 auto;
  }
  .menu-header h3{ margin:0; font-size:17px; font-weight:800; }
  .menu-close{
    width:30px; height:30px; border-radius:50%; border:none;
    background:var(--surface); font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .menu-tabs{
    display:flex; gap:6px; padding:2px 14px 12px;
    flex:0 0 auto;
    border-bottom:1px solid var(--border);
  }
  .menu-tab{
    font-family:'Manrope',sans-serif; font-size:12.5px; font-weight:700;
    background:var(--surface); border:none; border-radius:20px;
    padding:8px 14px; color:var(--ink-soft); cursor:pointer;
  }
  .menu-tab.active{ background:var(--ink); color:#fff; }
  .menu-content{
    flex:1; overflow-y:auto;
    padding:16px 18px 40px;
    -webkit-overflow-scrolling:touch;
  }

  /* Itinerary list inside menu */
  .glance-block-header{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    padding:16px 4px 8px; display:flex; align-items:center; gap:6px;
  }
  .glance-block-header:first-child{ padding-top:0; }
  .glance-row{
    display:flex; gap:10px; align-items:center;
    padding:12px 10px; border-radius:10px; cursor:pointer;
    background:var(--surface); margin-bottom:6px;
  }
  .glance-row:active{ background:var(--surface-2); }
  .glance-date{ font-size:12px; font-weight:800; color:var(--ink-soft); width:52px; flex:0 0 auto; line-height:1.3; }
  .glance-desc{ font-size:13.5px; font-weight:600; color:var(--ink); flex:1; line-height:1.35; }
  .glance-chevron{ font-size:16px; color:var(--ink-faint); flex:0 0 auto; }

  /* Sub-tabs (bookings) */
  .subtabs{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px; }
  .subtab{
    font-family:'Manrope',sans-serif; font-size:11.5px; font-weight:700;
    background:var(--surface); border:none; border-radius:16px;
    padding:6px 11px; color:var(--ink-soft); cursor:pointer;
  }
  .subtab.active{ background:var(--accent-soft); color:var(--accent); }

  .book-row{
    padding:11px 12px; background:var(--surface); border-radius:10px; margin-bottom:8px;
  }
  .book-row .b-what{ font-size:13.5px; font-weight:700; }
  .book-row .b-meta{ font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:4px; }
  .status-pill{
    display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:10px; margin-right:6px;
  }
  .status-pill.booked{ background:var(--green-soft); color:var(--green); }
  .status-pill.tobook{ background:var(--gold-soft); color:var(--gold); }

  .meals-table{ width:100%; border-collapse:collapse; font-size:10.5px; }
  .meals-table th{
    text-align:left; font-weight:800; color:var(--ink-faint); font-size:10px;
    padding:6px 4px; border-bottom:2px solid var(--border);
  }
  .meals-table td{
    padding:7px 4px; border-bottom:1px solid var(--border); vertical-align:top;
    line-height:1.35; font-weight:500;
  }
  .meals-table td.meal-date{ font-weight:800; white-space:nowrap; color:var(--ink); }
  .meals-table tr:nth-child(even) td{ background:var(--surface); }

  /* ---------- Day map ---------- */
  .day-map-wrap{ margin-bottom:16px; }
  .map-toggle-row{ display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .map-toggle-btn{
    font-family:'Manrope',sans-serif; font-size:11.5px; font-weight:700;
    background:var(--surface); border:none; border-radius:16px;
    padding:6px 12px; color:var(--ink-soft); cursor:pointer;
  }
  .map-toggle-btn.active{ background:var(--ink); color:#fff; }
  .day-map{
    width:100%; height:220px; border-radius:12px; overflow:hidden;
    background:var(--surface);
    position:relative; isolation:isolate; z-index:0;
  }
  .leaflet-popup-content{ font-family:'Manrope',sans-serif; font-size:12.5px; font-weight:600; }
  .leaflet-popup-content b{ font-weight:800; }

  /* ---------- Trip-wide map (Itinerary tab) ---------- */
  .itin-subtoggle{ display:flex; gap:6px; margin-bottom:14px; }
  .trip-map{
    width:100%; height:340px; border-radius:12px; overflow:hidden;
    background:var(--surface); margin-bottom:10px;
    position:relative; isolation:isolate; z-index:0;
  }
  .trip-map-legend{
    display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; font-weight:600; color:var(--ink-soft);
    padding:0 2px;
  }
  .trip-map-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .leg-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .info-block{ margin-bottom:20px; }
  .info-block h4{ font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:0 0 8px; font-weight:800; }
  .info-line{ font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--border); }
  .info-line b{ font-weight:700; }
  .contact-card{
    background:var(--surface); border-radius:12px; padding:14px; font-size:13px; line-height:1.7;
  }
  .contact-card .c-name{ font-weight:800; font-size:14px; margin-bottom:2px; }

  /* ---------- Meal cards (distinct from landmarks) ---------- */
  .stop.meal{
    background:var(--meal-bg);
  }
  .timeline-item.meal .rail-dot{
    background:var(--meal-accent);
  }
  .meal-icon{ font-size:14px; margin-right:2px; }

  /* ---------- Intro / city context section ---------- */
  .intro-card{
    background:var(--accent-soft);
    border-radius:var(--radius);
    margin-bottom:16px;
    overflow:hidden;
  }
  .intro-head{
    display:flex; align-items:center; gap:10px;
    padding:13px 14px;
    cursor:pointer;
  }
  .intro-head .intro-icon{ font-size:16px; }
  .intro-head .intro-title{ flex:1; font-weight:800; font-size:14.5px; color:var(--ink); }
  .intro-head .chevron{ padding-top:0; }
  .intro-body{ max-height:0; overflow:hidden; transition:max-height .28s ease; }
  .intro-card.open .intro-body{ max-height:1000px; }
  .intro-card.open .chevron{ transform:rotate(180deg); }
  .intro-body-inner{ padding:0 14px 16px; }
  .intro-photo{
    width:100%; aspect-ratio:16/9; border-radius:10px; margin-bottom:12px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); font-size:12px; font-weight:600;
  }
  .intro-text{ font-size:14px; line-height:1.65; color:var(--ink); font-weight:450; }

  footer{
    text-align:center; font-size:11px; color:var(--ink-faint); padding:30px 18px 10px; font-weight:500;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <button class="menu-btn" onclick="openMenu()">☰</button>
    <div class="trip-title-compact">
      <div class="trip-name">Italy, Croatia &amp; Montenegro</div>
      <div class="trip-dates">Jun 5–30, 2027 · Draft</div>
    </div>
  </div>
  <div class="date-strip-wrap">
    <div class="date-strip" id="dateStrip"></div>
  </div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="if(event.target===this)closeMenu()">
  <div class="menu-panel">
    <div class="menu-header">
      <h3>Menu</h3>
      <button class="menu-close" onclick="closeMenu()">✕</button>
    </div>
    <div class="menu-tabs">
      <button class="menu-tab active" data-tab="itinerary" onclick="switchMenuTab('itinerary')">Itinerary</button>
      <button class="menu-tab" data-tab="bookings" onclick="switchMenuTab('bookings')">Bookings</button>
      <button class="menu-tab" data-tab="contacts" onclick="switchMenuTab('contacts')">Contacts</button>
      <button class="menu-tab" data-tab="info" onclick="switchMenuTab('info')">Info</button>
    </div>
    <div class="menu-content" id="menuContent"></div>
  </div>
</div>

<main id="dayContainer"></main>

<script>
// ======================= DUMMY DATA (placeholder only) =======================
const TRIP_START = new Date(2027, 5, 5);
const TRIP_END   = new Date(2027, 5, 30);

const days = [
  { date: new Date(2027,5,5), block: "prelude", title: "Depart Miami", sub: "AA38 overnight flight to Rome.",
    cityPins: [],
    context: null,
    routeUrl: null,
    townRoutes: null,
    driverToday: false,
    stops: []
  },
  { date: new Date(2027,5,6), block: "florence", title: "Arrive Florence", sub: "Arrive Florence",
    cityPins: [{"lat":43.7696,"lng":11.2558,"name":"Florence"}],
    context: "Florence was the birthplace of the Renaissance — the 15th-century explosion of art, architecture, and humanist thought that reshaped Western culture, fueled by the wealth and patronage of the Medici banking family. For over a thousand years it has drawn people to walk the same stone streets as Michelangelo, Dante, and Machiavelli. Your hotel sits in the heart of the historic center, a UNESCO World Heritage Site since 1982 — everything you'll see this week is within a comfortable walk.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Cattedrale+di+Santa+Maria+del+Fiore+Florence/Ponte+Vecchio+Florence/Piazza+della+Signoria+Florence/",
    townRoutes: null,
    driverToday: false,
    stops: [{"time":"Breakfast","name":"Breakfast — on the overnight flight","type":"meal","desc":"Served before landing."},{"time":"12:05pm","name":"Leonardo Express + Frecciarossa","cantMiss":false,"duration":"~2 hrs total transit","access":"outside","mapLink":null,"desc":"FCO airport to Roma Termini (~32 min), then Rome to Florence (~1h30) — the fastest, most comfortable route after an overnight flight.","ticket":"Ticket info","warning":null,"gettingHere":null},{"time":"~4:15pm","name":"Taxi to Hotel Davanzati","type":"meal","icon":"🚕","desc":"Ring the bell for help with the 26 steps up to reception."},{"time":"6:00pm","name":"Sunday Mass — Duomo","coords":[43.7731,11.256],"cantMiss":false,"duration":"~45 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Cattedrale+di+Santa+Maria+del+Fiore","desc":"The cathedral interior is reserved for prayer on Sundays — attending Mass is the only way to see inside the cathedral on this day.","ticket":null,"warning":null,"gettingHere":"5 min walk from the hotel"},{"time":"7:00pm","name":"Ponte Vecchio","coords":[43.768,11.2531],"cantMiss":true,"duration":"20 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Ponte+Vecchio+Florence","desc":"Florence's oldest bridge, first built in Roman times and rebuilt after a 1345 flood. It's the only Florentine bridge to survive World War II — legend holds Hitler ordered it spared. Lined with jewelers' shops since 1593, when the Medici evicted the butchers whose refuse was fouling the river.","ticket":null,"warning":null,"gettingHere":"5 min walk from the Duomo"},{"time":"7:20pm","name":"Piazza della Signoria","coords":[43.7696,11.2558],"cantMiss":false,"duration":"20 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+della+Signoria+Florence","desc":"The political heart of Florence since the 14th century, dominated by the fortress-like Palazzo Vecchio. This is where Savonarola's 'Bonfire of the Vanities' burned art and books in 1497, and where he himself was executed the following year.","ticket":null,"warning":null,"gettingHere":"3 min walk from Ponte Vecchio"},{"time":"Dinner","name":"Dinner — near the hotel","type":"meal","desc":"TBD, first night, keep it easy."}]

  { date: new Date(2027,5,7), block: "florence", title: "Florence: Accademia, Santa Maria Novella, Duomo Complex", sub: "Florence: Accademia, Santa Maria Novella, Duomo Complex",
    cityPins: [{"lat":43.7696,"lng":11.2558,"name":"Florence"}],
    context: "Today covers three of the sights that define Florence's Renaissance identity — walked as one continuous sweep from north to south, with no backtracking.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Galleria+dell%27Accademia+Florence/Santa+Maria+Novella+Florence/Cattedrale+di+Santa+Maria+del+Fiore+Florence/",
    townRoutes: null,
    driverToday: false,
    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati","type":"meal","desc":"Included."},{"time":"9:00am","name":"Accademia Gallery — David","coords":[43.7767,11.2588],"cantMiss":true,"duration":"60-90 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Galleria+dell%27Accademia+Florence","desc":"Michelangelo carved David from a single 17-foot block of Carrara marble that two earlier sculptors had already given up on as flawed. He was 26. Finished in 1504, the statue originally stood outside Palazzo Vecchio as a civic symbol — Florence, like David, defiant against more powerful enemies (Rome, Milan). The gallery also holds his four unfinished 'Prisoners,' figures seemingly still trapped inside the stone, and a long corridor of Florentine Gothic and early Renaissance paintings.","ticket":"🎟️ Book 6-8 weeks ahead for June","warning":"Same-day walk-up queues run 2+ hours in peak season","gettingHere":null},{"time":"10:50am","name":"Santa Maria Novella","coords":[43.7737,11.2486],"cantMiss":true,"duration":"45 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Santa+Maria+Novella+Florence","desc":"The principal Dominican church in Florence, its striking green-and-white marble facade designed by Leon Battista Alberti in the 1450s. Inside is Masaccio's Trinity (1427), the first painting in Western art to use mathematically correct linear perspective — visitors at the time reportedly thought there was a real hole in the wall. Ghirlandaio's fresco cycle in the main chapel is said to have influenced the young Michelangelo, who trained in his workshop.","ticket":"🎟️ ~€7.50","warning":null,"gettingHere":"~20 min walk southwest from the Accademia"},{"time":"12:15pm","name":"Lunch — near the Duomo","type":"meal","desc":"TBD."},{"time":"1:15pm","name":"Duomo interior + Baptistery","coords":[43.7731,11.2554],"cantMiss":true,"duration":"60-75 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Cattedrale+di+Santa+Maria+del+Fiore","desc":"The cathedral itself is free to walk into — a vast, deliberately austere Gothic interior, a striking contrast to the ornate marble exterior. Brunelleschi's dome soars overhead, still the largest masonry dome ever built, completed in 1436 without the flying buttresses or visible scaffolding that engineers of the time thought were required. The adjacent Baptistery, older than the cathedral itself, holds Ghiberti's gilded bronze doors, which Michelangelo nicknamed the 'Gates of Paradise.'","ticket":"🚪 Free (Baptistery ticketed separately, small fee)","warning":null,"gettingHere":"~17 min walk east from Santa Maria Novella"},{"time":"2:30pm","name":"Campanile di Giotto — climb","coords":[43.773,11.2558],"cantMiss":true,"duration":"40-50 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Campanile+di+Giotto+Florence","desc":"Giotto's bell tower, begun in 1334 — 414 steps up a straight tower with landings to rest along the way, notably easier than the dome climb next door. No advance timed-slot required. The real payoff: this is the one spot in the whole complex where you can actually see Brunelleschi's dome itself, up close — the famous silhouette you can't see while standing on top of it.","ticket":"🎟️ Duomo complex pass — no advance booking needed","warning":null,"gettingHere":"Right next to the Duomo, same piazza"},{"time":"Evening","name":"Dinner — historic center","type":"meal","desc":"TBD."}]
  },
  { date: new Date(2027,5,8), block: "florence", title: "Florence: Uffizi, Piazza della Signoria, Santa Croce, Pitti, Boboli, Sunset", sub: "Florence: Uffizi, Piazza della Signoria, Santa Croce, Pitti, Boboli, Sunset",
    cityPins: [{"lat":43.7696,"lng":11.2558,"name":"Florence"}],
    context: "The Renaissance-art day, crossing the Arno into Oltrarno for the Medici's grand garden, ending with two passes at Piazzale Michelangelo.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Uffizi+Gallery+Florence/Piazza+della+Signoria+Florence/Basilica+di+Santa+Croce+Florence/Palazzo+Pitti+Florence/Boboli+Gardens+Florence/Piazzale+Michelangelo+Florence/",
    townRoutes: null,
    driverToday: false,
    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati","type":"meal","desc":"Included."},{"time":"9:00am","name":"Uffizi Gallery","coords":[43.7678,11.2553],"cantMiss":true,"duration":"2.5-3 hrs","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Uffizi+Gallery+Florence","desc":"Built in 1560 as the Medici's administrative offices ('uffizi'), converted to a gallery by the family in the 16th century — one of the first museums in the modern sense. Home to Botticelli's Birth of Venus and Primavera, Leonardo's Annunciation, and a collection that traces Italian painting from Giotto through the High Renaissance. The Vasari Corridor above once let the Medici walk unseen from the Palazzo Vecchio, through the Uffizi, across the Ponte Vecchio, to Palazzo Pitti.","ticket":"🎟️ Book 4-6 weeks ahead for June","warning":null,"gettingHere":null},{"time":"12:00pm","name":"Piazza della Signoria & Loggia dei Lanzi","coords":[43.7696,11.2558],"cantMiss":true,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+della+Signoria+Florence","desc":"Florence's outdoor sculpture gallery — Cellini's bronze Perseus holding Medusa's severed head, and the Rape of the Sabine Women, stand in the open loggia, free to see anytime.","ticket":null,"warning":null,"gettingHere":"Right outside the Uffizi"},{"time":"12:45pm","name":"Santa Croce","coords":[43.7686,11.2626],"cantMiss":true,"duration":"90 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Basilica+di+Santa+Croce+Florence","desc":"Franciscan basilica, and the 'Temple of the Italian Glories' — the tombs of Michelangelo, Galileo (whose remains weren't allowed a religious burial here until 1737, a century after his death, due to his heresy conviction), and Machiavelli, plus a monument to Dante, whose actual tomb is in Ravenna, where he died in exile. Brunelleschi's Pazzi Chapel in the cloister is considered a masterpiece of early Renaissance architecture.","ticket":"🎟️ ~€8","warning":null,"gettingHere":"~10 min walk east"},{"time":"2:15pm","name":"Lunch — Santa Croce/Sant'Ambrogio","type":"meal","desc":"TBD."},{"time":"3:30pm","name":"Palazzo Pitti — optional","coords":[43.7654,11.2493],"cantMiss":false,"duration":"60-90 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Palazzo+Pitti+Florence","desc":"Optional, pick one or the other with Boboli if the day is running long — you'll have already done Uffizi and Santa Croce by this point. Built for a rival Florentine banking family in 1458, bought by the Medici in 1549 when they outgrew the Palazzo Vecchio. Now houses several museums including the Palatine Gallery's Raphaels and Titians.","ticket":"🎟️","warning":null,"gettingHere":"~8 min walk to Ponte Vecchio, cross into Oltrarno"},{"time":"5:00pm","name":"Boboli Gardens — optional","coords":[43.7629,11.2493],"cantMiss":true,"duration":"60 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Boboli+Gardens+Florence","desc":"Optional, pick one or the other with Pitti if the day is running long. The Medici's grand formal garden behind Palazzo Pitti, laid out from 1550 — one of the earliest and most influential examples of the Italian garden style, later copied across Europe including at Versailles. Room for the kids to run after two museum-heavy stops.","ticket":"🎟️","warning":null,"gettingHere":"Right behind Palazzo Pitti — the garden entrance is inside the palace courtyard"},{"time":"9:00pm","name":"Piazzale Michelangelo","coords":[43.7629,11.2653],"cantMiss":true,"duration":"60+ min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazzale+Michelangelo+Florence","desc":"Built in 1869, offering the classic panoramic view of Florence — domes, towers, and the Arno laid out below, with a bronze copy of David at its center. Timed for sunset, ~9:00-9:15pm in June.","ticket":null,"warning":null,"gettingHere":"Try walking via Costa San Giorgio and Via del Forte di San Giorgio, past Forte di Belvedere — shorter and more direct than going all the way around. If that route is closed, either walk the long way around (~30-40 min, steep) or take a taxi (~€10-15, ~10 min)."},{"time":"Dinner","name":"Dinner — near Piazzale Michelangelo","type":"meal","desc":"TBD."}]

  { date: new Date(2027,5,9), block: "florence", title: "Bologna Day-Trip", sub: "Bologna Day-Trip",
    cityPins: [{"lat":43.7696,"lng":11.2558,"name":"Florence"}],
    context: "Bologna — nicknamed 'La Grassa' (the fat one) for its food, 'La Dotta' (the learned) for housing Europe's oldest university (founded 1088), and 'La Rossa' (the red) for its terracotta rooftops and left-wing politics. A 35-minute Frecciarossa ride from Florence, walked as one compact loop.",
    routeUrl: "https://www.google.com/maps/dir/Firenze+Santa+Maria+Novella+Station/Via+Piella+Bologna/Piazza+Maggiore+Bologna/Archiginnasio+Bologna/Via+Pescherie+Vecchie+Bologna/Basilica+di+Santa+Maria+della+Vita+Bologna/Due+Torri+Bologna/",
    townRoutes: [{"label":"Bologna only (walking)","url":"https://www.google.com/maps/dir/Via+Piella+Bologna/Piazza+Maggiore+Bologna/Archiginnasio+Bologna/Via+Pescherie+Vecchie+Bologna/Basilica+di+Santa+Maria+della+Vita+Bologna/Due+Torri+Bologna/"}],
    driverToday: false,
    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati","type":"meal","desc":"Included."},{"time":"9:55am","name":"Via Piella — the secret window","coords":[44.499128,11.344842],"cantMiss":false,"duration":"5 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+Piella+Bologna","desc":"A small window in an unmarked wall looking down onto one of Bologna's few remaining visible canals — the city once had over 60km of navigable waterways used to transport goods and power silk mills; most were covered over in the 20th century.","ticket":null,"warning":null,"gettingHere":null},{"time":"10:30am","name":"Piazza Maggiore & San Petronio","coords":[44.4938,11.3428],"cantMiss":true,"duration":"30 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+Maggiore+Bologna","desc":"Bologna's grand main square, dominated by the Basilica of San Petronio — construction began in 1390 with plans to make it larger than St. Peter's in Rome. The Church intervened, funds were redirected to found the university instead, and the facade remains famously unfinished, half-clad in marble, half bare brick. It's free to enter one of the largest church interiors in the world.","ticket":null,"warning":null,"gettingHere":"~20 min walk down Via Indipendenza from the station"},{"time":"11:00am","name":"Archiginnasio","coords":[44.4926,11.3432],"cantMiss":false,"duration":"30 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Archiginnasio+Bologna","desc":"The main building of Europe's oldest university, in use from 1563 until 1803. The walls and ceilings of its corridors are covered in thousands of painted coats of arms of past students and rectors. A small fee gets you into the 17th-century Anatomical Theatre, where public dissections once drew crowds.","ticket":"🎟️ small fee","warning":null,"gettingHere":"Right behind San Petronio"},{"time":"11:40am","name":"Via degli Orefici → Via Pescherie Vecchie","coords":[44.4939,11.3436],"cantMiss":false,"duration":"20 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+Pescherie+Vecchie+Bologna","desc":"The entry streets of the Quadrilatero, Bologna's medieval market district — old fishmongers' stalls (pescherie) now sell fresh pasta, cheese, and cured meats spilling onto the cobblestones.","ticket":null,"warning":null,"gettingHere":"~5 min walk from Archiginnasio, back through Piazza Maggiore"},{"time":"12:00pm","name":"Santa Maria della Vita","coords":[44.493398,11.344617],"cantMiss":false,"duration":"15 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Basilica+di+Santa+Maria+della+Vita+Bologna","desc":"A small church holding one of Italy's most viscerally powerful Renaissance sculptures: Niccolò dell'Arca's life-sized terracotta Compianto sul Cristo morto (Lamentation over the Dead Christ), c. 1463 — figures frozen mid-scream and mid-grief around Christ's body.","ticket":null,"warning":null,"gettingHere":"A couple minutes further into the Quadrilatero"},{"time":"12:30pm","name":"Via Drapperie → Via Clavature → Via de' Ranocchi","coords":[44.4936,11.3444],"cantMiss":false,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Via+de%27+Ranocchi+Bologna","desc":"Continuing through the Quadrilatero. Via Ranocchi is home to L'Osteria del Sole, one of Bologna's oldest taverns, serving wine since 1465 (you bring your own food; they just pour).","ticket":null,"warning":null,"gettingHere":"Continuing directly on from Santa Maria della Vita"},{"time":"12:30pm","name":"Lunch — in the Quadrilatero","type":"meal","desc":"Along Via Drapperie / Clavature / Ranocchi."},{"time":"2:00pm","name":"Due Torri","coords":[44.494961,11.346232],"cantMiss":true,"duration":"15 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Due+Torri+Bologna","desc":"The Two Towers — Asinelli (97m, one of the tallest medieval towers in Italy) and the visibly leaning Garisenda, both built around 1109-1119 by rival noble families as status symbols, when Bologna once had well over 100 such towers. Viewing from the base only today.","ticket":null,"warning":null,"gettingHere":"~5 min walk from Via Ranocchi"}]
  },
  { date: new Date(2027,5,10), block: "florence", title: "Venice — Arrival Day", sub: "Venice — Arrival Day",
    cityPins: [{"lat":45.4342,"lng":12.3388,"name":"Venice"}],
    context: "Venice was founded by refugees fleeing barbarian invasions of the mainland in the 5th-6th centuries, who settled on a cluster of marshy lagoon islands precisely because they were nearly impossible to attack. What began as a refuge became, by the Middle Ages, the wealthiest maritime republic in the Mediterranean — the Most Serene Republic, ruled by an elected Doge, controlling trade routes from Europe to the Byzantine and Islamic worlds for over a thousand years. There are no cars anywhere in the historic center — everything moves by foot or by boat. Backpacks only today; your main luggage stays at Hotel Davanzati in Florence.",
    routeUrl: "https://www.google.com/maps/dir/AC+Hotel+Venezia/Jewish+Ghetto+Venice/Fondamenta+della+Misericordia+Venice/Rialto+Bridge+Venice/Santa+Maria+dei+Miracoli+Venice/Piazza+San+Marco+Venice/",
    townRoutes: null,
    driverToday: false,
    stops: [{"time":"Breakfast","name":"Breakfast — Hotel Davanzati","type":"meal","desc":"Included, before the train to Venice."},{"time":"10:15am","name":"Jewish Ghetto","coords":[45.4446,12.3266],"cantMiss":true,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Jewish+Ghetto+Venice","desc":"Established in 1516, the oldest Jewish ghetto in the world and the origin of the word itself (from the Venetian 'geto,' the foundry once located here). Home to five historic synagogues, some tucked invisibly into upper floors of ordinary-looking buildings.","ticket":null,"warning":null,"gettingHere":"A few minutes from the hotel"},{"time":"10:45am","name":"Fondamenta della Misericordia","coords":[45.4444,12.3298],"cantMiss":true,"duration":"20 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Fondamenta+della+Misericordia+Venice","desc":"The prettiest canal-side stretch in Cannaregio, lined with small bacari (wine bars) rather than the tourist crowds of the main routes.","ticket":null,"warning":null,"gettingHere":"A short walk from the Ghetto"},{"time":"11:05am","name":"Ponte Chiodo","coords":[45.442879,12.3346141],"cantMiss":false,"duration":"10 min","access":"outside","mapLink":"https://www.google.com/maps/place/Ponte+Chiodo/@45.442879,12.3346141,21z","desc":"One of the last bridges left in Venice with no railings — a reminder of how all the city's bridges looked before 19th-century safety additions.","ticket":null,"warning":null,"gettingHere":"Just off the fondamenta"},{"time":"","name":"Walk past: Calle Varisco","coords":[45.4432,12.335],"cantMiss":false,"duration":"2 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Calle+Varisco+Venice","desc":"The narrowest street in Venice — just 53cm at its tightest point. A fun quick detour, not a formal stop.","ticket":null,"warning":null,"gettingHere":"A couple minutes toward Rialto"},{"time":"11:35am","name":"Rialto Bridge & Market","coords":[45.438,12.3358],"cantMiss":true,"duration":"40 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Rialto+Bridge+Venice","desc":"The oldest bridge across the Grand Canal, completed in 1591 — for centuries the only way to cross on foot. The market at its foot has traded produce and fish since the 11th century.","ticket":null,"warning":null,"gettingHere":"Continuing toward Rialto"},{"time":"12:15pm","name":"T Fondaco Rooftop Terrace","coords":[45.4382733,12.3365754],"cantMiss":true,"duration":"30 min","access":"free","mapLink":"https://www.google.com/maps/place/T+Fondaco+Rooftop+Terrace/@45.4382733,12.3359317,19z","desc":"A free viewing terrace over the Grand Canal, inside what was once the German merchants' trading house, later a post office, now a department store. Book the free time slot in advance.","ticket":null,"warning":"Free slots must be reserved ahead — first come, first served","gettingHere":"Right by Rialto"},{"time":"12:45pm","name":"Lunch — Venice","type":"meal","desc":"TBD."},{"time":"2:00pm","name":"Santa Maria dei Miracoli","coords":[45.4408,12.3376],"cantMiss":true,"duration":"20 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Santa+Maria+dei+Miracoli+Venice","desc":"Venice's 'marble jewel box' — a small Renaissance church clad entirely in polychrome marble, built 1481-1489 by Pietro Lombardo, one of the earliest and most refined examples of early Venetian Renaissance architecture.","ticket":"🎟️ ~€3/adult","warning":null,"gettingHere":"A walk from Rialto, past lunch"},{"time":"2:30pm","name":"Libreria Acqua Alta","coords":[45.4368,12.3402],"cantMiss":true,"duration":"30 min","access":"free","mapLink":"https://www.google.com/maps/search/?api=1&query=Libreria+Acqua+Alta+Venice","desc":"The famous bookshop that stores its stock in bathtubs, gondolas, and a full-size boat — a defense against Venice's periodic flooding. A staircase made entirely of old encyclopedias leads to a canal-view terrace out back.","ticket":null,"warning":null,"gettingHere":"Toward Santa Maria Formosa"},{"time":"3:15pm","name":"Scala Contarini del Bovolo","coords":[45.4372,12.3346],"cantMiss":true,"duration":"30 min","access":"ticketed","mapLink":"https://www.google.com/maps/search/?api=1&query=Scala+Contarini+del+Bovolo+Venice","desc":"A 15th-century external spiral staircase, tucked down a hidden calle off Campo Manin — one of Venice's genuine hidden gems, rarely crowded. 'Bovolo' means snail in Venetian dialect.","ticket":null,"warning":null,"gettingHere":"Sits almost exactly between Rialto and San Marco"},{"time":"4:00pm","name":"Piazza San Marco","coords":[45.4342,12.3388],"cantMiss":true,"duration":"15 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Piazza+San+Marco+Venice","desc":"The political and religious heart of Venice for over a thousand years, Napoleon reportedly called it 'the drawing room of Europe.'","ticket":null,"warning":null,"gettingHere":"Continuing toward the water"},{"time":"4:15pm","name":"St. Mark's Basilica — exterior","coords":[45.4345,12.3397],"cantMiss":true,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=St+Mark%27s+Basilica+Venice","desc":"Byzantine domes and golden mosaics visible from outside; the loot of centuries of Venetian trade and conquest is built into its very walls, including the four bronze horses looted from Constantinople in 1204.","ticket":null,"warning":null,"gettingHere":"Right there on the piazza"},{"time":"4:45pm","name":"Doge's Palace + Bridge of Sighs — exterior","coords":[45.4337,12.3406],"cantMiss":false,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Doge%27s+Palace+Venice","desc":"The Gothic seat of Venetian government for centuries. The Bridge of Sighs, connecting the palace to the old prisons, is viewable from Ponte della Paglia — condemned prisoners supposedly sighed at their last glimpse of the city through its windows.","ticket":null,"warning":null,"gettingHere":"Right next to the Basilica"},{"time":"5:15pm","name":"Gondola ride","coords":[45.4338,12.3369],"cantMiss":true,"duration":"30 min","access":"outside","mapLink":"https://www.google.com/maps/search/?api=1&query=Bacino+Orseolo+Venice","desc":"Venice's main gondola basin, tucked just behind Piazza San Marco. Fixed rate, one gondola fits all four of you.","ticket":"~€90 for 30 min","warning":null,"gettingHere":"A short walk to Bacino Orseolo"},{"time":"7:30pm","name":"Dinner — Da Mamo","type":"meal","desc":"Between San Marco and Rialto, ~10 min walk from the square."}]

  { date: new Date(2027,5,11), block: "florence", title: "Murano & Return to Florence", sub: "Murano & Return to Florence",
    cityPins: [{"lat":45.4595,"lng":12.3502,"name":"Murano"}],
    context: "Murano has been the center of Venetian glassmaking since 1291, when the Republic ordered all glass furnaces moved there — officially to reduce fire risk in Venice's wooden city, though protecting the secrets of the trade was likely just as important. For centuries, Murano glassmakers were treated as minor nobility, forbidden from leaving the Republic on pain of death, so their techniques couldn't be sold abroad.",
    routeUrl: "https://www.google.com/maps/dir/Ferrovia+Vaporetto+Venice/Wave+Murano+Glass/Basilica+dei+Santi+Maria+e+Donato+Murano/",

  { date: new Date(2027,5,14), block: "florence", title: "Ravenna & Porto Corsini — Embarkation Day", sub: "Ravenna & Porto Corsini — Embarkation Day",
    cityPins: [{"lat":44.4177,"lng":12.1997,"name":"Ravenna"}],
    context: "Ravenna was, remarkably, the capital of the Western Roman Empire (from 402 AD), then of the Ostrogothic Kingdom, then a Byzantine outpost — and each regime left behind mosaics of extraordinary quality, preserved because the city fell into economic obscurity for over a thousand years after, freezing its treasures in place. UNESCO lists eight of its monuments together as a single World Heritage Site, calling them 'a supreme artistic expression' bridging the Roman, Christian, and Byzantine worlds.",
    routeUrl: "https://www.google.com/maps/dir/Hotel+Davanzati+Via+Porta+Rossa+5+Florence/Basilica+di+San+Vitale+Ravenna/Dante%27s+Tomb+Ravenna/Basilica+di+Sant%27Apollinare+Nuovo+Ravenna/Porto+Corsini+Cruise+Terminal/",
    townRoutes: [{"label":"Ravenna only (walking)","url":"https://www.google.com/maps/dir/Basilica+di+San+Vitale+Ravenna/Mausoleum+of+Galla+Placidia+Ravenna/Via+Cavour+Ravenna/Piazza+del+Popolo+Ravenna/Dante%27s+Tomb+Ravenna/Basilica+di+Sant%27Apollinare+Nuovo+Ravenna/"}],

function fmtLong(d){
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

const strip = document.getElementById('dateStrip');
const container = document.getElementById('dayContainer');
const today = new Date();
const blockAbbrev = { florence: "FLR", cruise: "SEA", rome: "ROM" };

let prevBlock = null;
days.forEach((day, i) => {
  // block separator label, inserted whenever the block changes (skip for "prelude" — no label needed before it)
  if (day.block !== prevBlock && day.block !== 'prelude'){
    const sep = document.createElement('div');
    sep.className = `block-sep block-${day.block}`;
    sep.innerHTML = `<div class="sep-label">${blockAbbrev[day.block]}</div>`;
    strip.appendChild(sep);
  }
  prevBlock = day.block;
  // chip
  const chip = document.createElement('div');
  chip.className = `chip block-${day.block}`;
  chip.dataset.idx = i;
  chip.innerHTML = `<div class="dow">${dow[day.date.getDay()]}</div><div class="dom">${day.date.getDate()}</div>`;
  chip.addEventListener('click', () => showDay(i));
  strip.appendChild(chip);

  // day section
  const sec = document.createElement('section');
  sec.className = 'day-section';
  sec.id = `day-${i}`;
  sec.style.display = 'none';

  let stopsHtml = '';
  day.stops.forEach((s, si) => {
    if (s.section){
      stopsHtml += `<div class="section-divider">${s.section}</div>`;
      return;
    }
    const gettingHtml = s.gettingHere ? `<div class="getting-here"><span class="gh-icon">↳</span>${s.gettingHere}</div>` : '';
    if (s.type === 'meal'){
      stopsHtml += `
        ${gettingHtml}
        <div class="timeline-item meal">
          <div class="rail"><div class="rail-dot"></div><div class="rail-line"></div></div>
          <div class="stop meal" id="stop-${i}-${si}">
            <div class="stop-head" onclick="toggleStop(${i},${si})">
              <div class="stop-time">${s.time || ''}</div>
              <div class="stop-main">
                <div class="stop-name"><span class="meal-icon">${s.icon || '🍴'}</span>${s.name}</div>
              </div>
              <div class="chevron">▾</div>
            </div>
            <div class="stop-body">
              <div class="stop-body-inner">
                <div class="stop-desc">${s.desc || ''}</div>
              </div>
            </div>
          </div>
        </div>`;
      return;
    }
    const badges = [];
    if (s.access === 'ticketed') badges.push(`<span class="badge ticketed">🎟️ Ticketed</span>`);
    if (s.access === 'free') badges.push(`<span class="badge free">🚪 Free entry</span>`);
    if (s.access === 'outside') badges.push(`<span class="badge outside">🚶 Outside</span>`);
    if (s.duration) badges.push(`<span class="badge duration">⏱️ ${s.duration}</span>`);
    stopsHtml += `
      ${gettingHtml}
      <div class="timeline-item ${s.cantMiss ? 'cantmiss' : ''}">
        <div class="rail"><div class="rail-dot"></div><div class="rail-line"></div></div>
        <div class="stop" id="stop-${i}-${si}">
          <div class="stop-head" onclick="toggleStop(${i},${si})">
            <div class="stop-time">${s.time || ''}</div>
            <div class="stop-main">
              <div class="stop-name">${s.cantMiss ? '⭐ ' : ''}${s.name}</div>
              <div class="stop-meta">
                ${badges.join('')}
                ${s.mapLink ? `<a class="maps-chip" href="${s.mapLink}" onclick="event.stopPropagation()">📍 Maps</a>` : ''}
              </div>
            </div>
            <div class="chevron">▾</div>
          </div>
          <div class="stop-body">
            <div class="stop-body-inner">
              <div class="stop-photo">photo loads here on expand</div>
              <div class="stop-desc">${s.desc || ''}</div>
              ${s.warning ? `<div class="stop-warning">⚠️ ${s.warning}</div>` : ''}
              ${s.ticket ? `<div class="stop-ticket">🎟️ ${s.ticket}</div>` : ''}
            </div>
          </div>
        </div>
      </div>`;
  });

  if (day.stops.length === 0){
    stopsHtml = `<div style="padding:34px 0;text-align:center;color:var(--ink-faint);font-size:13.5px;font-weight:500;">Planning not started for this day yet.</div>`;
  }

  const introHtml = day.context ? `
    <div class="intro-card" id="intro-${i}">
      <div class="intro-head" onclick="toggleIntro(${i})">
        <span class="intro-icon">🌍</span>
        <span class="intro-title">Intro — about today</span>
        <div class="chevron">▾</div>
      </div>
      <div class="intro-body">
        <div class="intro-body-inner">
          <div class="intro-photo">${day.contextImg || 'photo loads here on expand'}</div>
          <div class="intro-text">${day.context}</div>
        </div>
      </div>
    </div>` : '';

  const townsInDay = day.stops.filter(s => s.section).map(s => s.section);
  const hasMapPoints = day.stops.some(s => s.coords);
  const townRoutesHtml = (day.townRoutes || []).map(tr =>
    `<a class="route-link secondary" href="${tr.url}">🗺️ ${tr.label}</a>`
  ).join('');
  let mapsCardHtml = '';
  if (hasMapPoints || day.routeUrl) {
    const toggles = ['Full day', ...townsInDay];
    mapsCardHtml = `
      <div class="intro-card maps-card" id="mapsCard-${i}">
        <div class="intro-head" onclick="toggleMapsCard(${i})">
          <span class="intro-icon">🗺️</span>
          <span class="intro-title">Maps & Routes</span>
          <div class="chevron">▾</div>
        </div>
        <div class="intro-body">
          <div class="intro-body-inner">
            ${hasMapPoints ? `
            <div class="map-toggle-row">
              ${toggles.map((t, ti) => `<button class="map-toggle-btn ${ti===0?'active':''}" onclick="setDayMapFilter(${i},'${t}',this)">${t}</button>`).join('')}
            </div>
            <div class="day-map" id="dayMap-${i}"></div>` : ''}
            ${day.routeUrl ? `<a class="route-link" href="${day.routeUrl}">🗺️ Open full day route in Google Maps</a>` : ''}
            ${townRoutesHtml}
          </div>
        </div>
      </div>`;
  }

  const driverHtml = day.driverToday ? `
    <div class="driver-box">
      <div class="driver-title">🚗 Today's driver — Truescany</div>
      <div class="driver-line">📞 +39 055 0935928 · 💬 WhatsApp same number</div>
    </div>` : '';

  sec.innerHTML = `
    <div class="day-header">
      <h2 class="block-${day.block}">${fmtLong(day.date)}</h2>
      ${day.title || day.sub ? `<div class="day-sub block-${day.block}"><span class="accent-bar"></span><span>${day.title}${day.sub ? ' — ' + day.sub : ''}</span></div>` : ''}
    </div>
    ${introHtml}
    ${mapsCardHtml}
    ${driverHtml}
    ${day.stops.length ? `
    <div class="day-toolbar">
      <button class="expand-toggle" onclick="toggleAll(${i}, this)">Expand all</button>
    </div>` : ''}
    ${stopsHtml}
  `;
  container.appendChild(sec);
});

function toggleIntro(i){
  document.getElementById(`intro-${i}`).classList.toggle('open');
}

function toggleMapsCard(i){
  const card = document.getElementById(`mapsCard-${i}`);
  const wasOpen = card.classList.contains('open');
  card.classList.toggle('open');
  if (!wasOpen && document.getElementById(`dayMap-${i}`)){
    setTimeout(() => {
      initDayMap(i);
      if (dayMapInstances[i]) dayMapInstances[i].invalidateSize();
    }, 300);
  }
}

// ======================= DAY MAP =======================
const dayMapInstances = {};
const dayMapMarkers = {};

function collectStopsWithCoords(day){
  const out = [];
  let currentSection = null;
  day.stops.forEach(s => {
    if (s.section){ currentSection = s.section; return; }
    if (s.coords) out.push({ ...s, section: currentSection });
  });
  return out;
}

function initDayMap(i){
  if (dayMapInstances[i]) return;
  if (typeof L === 'undefined'){ setTimeout(() => initDayMap(i), 150); return; }
  const day = days[i];
  const pts = collectStopsWithCoords(day);
  if (!pts.length) return;
  const el = document.getElementById(`dayMap-${i}`);
  if (!el) return;
  const map = L.map(el, { scrollWheelZoom: false }).setView(pts[0].coords, 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  const markers = pts.map((s, idx) => {
    const color = s.cantMiss ? '#E5484D' : '#2F6FED';
    const icon = L.divIcon({
      className: '', html: `<div style="background:${color};width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);color:#fff;font-size:10px;font-weight:800;">${idx+1}</span></div>`,
      iconSize: [22,22], iconAnchor: [11,22],
    });
    const m = L.marker(s.coords, { icon }).addTo(map);
    m.bindPopup(`<b>${idx+1}. ${s.name}</b>${s.time ? '<br>' + s.time : ''}`);
    m.__section = s.section;
    return m;
  });
  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.2));
  dayMapInstances[i] = map;
  dayMapMarkers[i] = markers;
}

function setDayMapFilter(i, filter, btn){
  document.querySelectorAll(`#day-${i} .map-toggle-btn`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const map = dayMapInstances[i];
  const markers = dayMapMarkers[i];
  if (!map || !markers) return;
  const visible = markers.filter(m => filter === 'Full day' || m.__section === filter);
  markers.forEach(m => map.removeLayer(m));
  visible.forEach(m => m.addTo(map));
  if (visible.length){
    const group = L.featureGroup(visible);
    map.fitBounds(group.getBounds().pad(0.3));
  }
}

function showDay(i){
  document.querySelectorAll('.day-section').forEach(s => s.style.display = 'none');
  document.querySelectorAll('.chip').forEach(s => s.classList.remove('active'));
  const daySection = document.getElementById(`day-${i}`);
  if (daySection) daySection.style.display = 'block';
  const chip = document.querySelector(`.chip[data-idx="${i}"]`);
  if (chip){
    chip.classList.add('active');
    if (typeof chip.scrollIntoView === 'function'){
      try { chip.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); } catch(e) {}
    }
  }
}

function toggleStop(dayIdx, stopIdx){
  document.getElementById(`stop-${dayIdx}-${stopIdx}`).classList.toggle('open');
}

function toggleAll(dayIdx, btn){
  const sec = document.getElementById(`day-${dayIdx}`);
  const stops = sec.querySelectorAll('.stop');
  const anyClosed = [...stops].some(s => !s.classList.contains('open'));
  stops.forEach(s => s.classList.toggle('open', anyClosed));
  btn.textContent = anyClosed ? 'Collapse all' : 'Expand all';
}

// ======================= MENU =======================
const fmtShort = d => d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

function openMenu(){
  document.getElementById('menuOverlay').classList.add('open');
  renderMenuTab('itinerary');
}
function closeMenu(){
  document.getElementById('menuOverlay').classList.remove('open');
}
function switchMenuTab(tab){
  document.querySelectorAll('.menu-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderMenuTab(tab);
}
function jumpFromMenu(i){
  closeMenu();
  showDay(i);
}

function renderMenuTab(tab){
  const c = document.getElementById('menuContent');
  if (tab === 'itinerary') c.innerHTML = renderItinTab('list');
  if (tab === 'bookings') c.innerHTML = renderBookingsTab('attractions');
  if (tab === 'contacts') c.innerHTML = renderContactsTab();
  if (tab === 'info') c.innerHTML = renderInfoOnlyTab();
}

function renderItinTab(mode){
  const toggle = `
    <div class="itin-subtoggle">
      <button class="subtab ${mode==='list'?'active':''}" onclick="switchItinMode('list')">List</button>
      <button class="subtab ${mode==='map'?'active':''}" onclick="switchItinMode('map')">Map</button>
    </div>`;
  if (mode === 'map'){
    return toggle + `
      <div class="trip-map" id="tripMap"></div>
      <div class="trip-map-legend">
        <span><span class="leg-dot" style="background:#A8A8AF"></span>Past</span>
        <span><span class="leg-dot" style="background:#E5484D"></span>Today</span>
        <span><span class="leg-dot" style="background:#2F6FED"></span>Upcoming</span>
      </div>`;
  }
  return toggle + renderItineraryList();
}

function switchItinMode(mode){
  document.getElementById('menuContent').innerHTML = renderItinTab(mode);
  if (mode === 'map') setTimeout(initTripMap, 50);
}

let tripMapInstance = null;
function initTripMap(){
  const el = document.getElementById('tripMap');
  if (!el) return;
  if (typeof L === 'undefined'){ setTimeout(initTripMap, 150); return; }
  if (tripMapInstance) { tripMapInstance.remove(); tripMapInstance = null; }
  const map = L.map(el, { scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  const today0 = new Date(); today0.setHours(0,0,0,0);
  const allMarkers = [];
  days.forEach(day => {
    const day0 = new Date(day.date); day0.setHours(0,0,0,0);
    const color = day0.getTime() === today0.getTime() ? '#E5484D' : (day0 < today0 ? '#A8A8AF' : '#2F6FED');
    (day.cityPins || []).forEach(p => {
      const m = L.circleMarker([p.lat, p.lng], { radius: 6, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.95 }).addTo(map);
      m.bindPopup(`<b>${p.name}</b><br>${fmtShort(day.date)}`);
      allMarkers.push(m);
    });
  });
  if (allMarkers.length){
    const group = L.featureGroup(allMarkers);
    map.fitBounds(group.getBounds().pad(0.1));
  } else {
    map.setView([43.7, 11.3], 6);
  }
  tripMapInstance = map;
}

function renderItineraryList(){
  let html = '';
  let prev = null;
  days.forEach((day, i) => {
    if (day.block !== prev){
      html += `<div class="glance-block-header block-${day.block}"><span class="lbl-dot"></span>${blockLabel[day.block]}</div>`;
      prev = day.block;
    }
    html += `<div class="glance-row" onclick="jumpFromMenu(${i})">
      <div class="glance-date">${fmtShort(day.date)}</div>
      <div class="glance-desc">${day.title}</div>
      <div class="glance-chevron">›</div>
    </div>`;
  });
  return html;
}

function renderBookingsTab(activeSub){
  const subs = ['attractions','transport','hotels','meals'];
  const subLabels = { attractions:'Attractions', transport:'Transport', hotels:'Hotels', meals:'Meals' };
  let tabsHtml = `<div class="subtabs">` + subs.map(s =>
    `<button class="subtab ${s===activeSub?'active':''}" onclick="renderSub('${s}')">${subLabels[s]}</button>`
  ).join('') + `</div>`;
  let rowsHtml = `<div id="bookingRows">` + bookingRowsHtml(activeSub) + `</div>`;
  return tabsHtml + rowsHtml;
}
function bookingRowsHtml(sub){
  if (sub === 'meals') return mealsTableHtml();
  return bookings[sub].map(b => `
    <div class="book-row">
      <span class="status-pill ${b.status}">${b.status==='booked' ? '✓ Booked' : 'To book'}</span>
      <div class="b-what">${b.what}</div>
      <div class="b-meta">${b.meta}</div>
    </div>`).join('');
}
function mealsTableHtml(){
  const rows = bookings.meals.map(m => `
    <tr>
      <td class="meal-date">${m.date}</td>
      <td>${m.b}</td>
      <td>${m.l}</td>
      <td>${m.d}</td>
    </tr>`).join('');
  return `
    <table class="meals-table">
      <thead><tr><th></th><th>🍳 B</th><th>🥗 L</th><th>🍽️ D</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}
function renderSub(sub){
  document.querySelectorAll('.subtab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase() === sub));
  document.getElementById('bookingRows').innerHTML = bookingRowsHtml(sub);
}

function renderContactsTab(){
  const d = contactsData.driver;
  const driverHtml = `
    <div class="info-block"><h4>Driver</h4>
      <div class="contact-card">
        <div class="c-name">${d.company}</div>
        Contact: ${d.contact}<br>
        📞 ${d.phone}<br>
        💬 WhatsApp: ${d.whatsapp}<br>
        ✉️ ${d.email}<br>
        📍 ${d.address}
      </div>
    </div>`;
  const hotelsHtml = `
    <div class="info-block"><h4>Hotels</h4>
      ${contactsData.hotelsList.map(h => `
        <div class="contact-card" style="margin-bottom:8px;">
          <div class="c-name">${h.name}</div>
          ${h.dates}<br>
          📞 ${h.phone}<br>
          ✉️ ${h.email}
        </div>`).join('')}
    </div>`;
  return driverHtml + hotelsHtml;
}

function renderInfoOnlyTab(){
  const cur = infoData.currency.map(x => `<div class="info-line"><b>${x.c}</b> — ${x.note}</div>`).join('');
  const em = infoData.emergency.map(x => `<div class="info-line"><b>${x.c}</b> — Emergency ${x.emergency} · Police ${x.police} · Ambulance ${x.ambulance}</div>`).join('');
  return `
    <div class="info-block"><h4>Currency</h4>${cur}</div>
    <div class="info-block"><h4>Emergency Numbers</h4>${em}</div>`;
}

// ======================= AUTO-JUMP TO TODAY =======================
let matchIdx = days.findIndex(d => sameDay(d.date, today));
if (matchIdx === -1) matchIdx = 0;
showDay(matchIdx);
</script>
